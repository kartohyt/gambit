const clampV = v => Math.max(-2000, Math.min(2000, v));
const sameMove = (a, b) => a.from === b.from && a.to === b.to && (a.promo || null) === (b.promo || null);

// After the move is made: a piece was left en prise for less than it is worth
function isSacrifice(s, m) {
  const t = m.p[1];
  if (t === 'P' || t === 'K') return false;
  const col = m.p[0], give = VAL[t] - (m.cap ? VAL[m.cap[1]] : 0);
  if (give < 200 || !attacked(s.b, m.to, opp(col))) return false;
  return !attacked(s.b, m.to, col) || VAL[t] >= 500;
}

function classify(loss, sac, bestV) {
  if (sac && loss <= 20 && bestV < 600) return 'brill';
  if (loss <= 10) return 'best';
  if (loss <= 60) return 'good';
  if (loss <= 150) return 'inacc';
  if (loss <= 300) return 'mist';
  return 'blun';
}

let report = null, anToken = 0;
function analyze() {
  const token = ++anToken, list = history.map(h => h.m), s = initial();
  report = { plies: [], done: false };
  let i = 0;
  const step = () => {
    if (token !== anToken) return;
    if (i >= list.length) { report.done = true; saveAccuracy(); render(); return; }
    const col = s.turn, ms = legal(s);
    let best = ms[0], bestV = -Infinity, playedV = null, pm = ms[0];
    for (const m of ms) {
      make(s, m);
      const v = clampV(-negamax(s, 2, -Infinity, Infinity, 1));
      unmake(s);
      if (v > bestV) { bestV = v; best = m; }
      if (sameMove(m, list[i])) { playedV = v; pm = m; }
    }
    const loss = sameMove(best, pm) ? 0 : Math.max(0, bestV - playedV);
    const bestSan = san(s, best, ms);
    make(s, pm);
    report.plies.push({ col, loss, bestSan, best: { from: best.from, to: best.to }, isBest: sameMove(best, pm), cls: classify(loss, isSacrifice(s, pm), bestV) });
    i++;
    render();
    setTimeout(step, 0);
  };
  render();
  setTimeout(step, 30);
}

function renderReport() {
  const el = $('report');
  if (!report) { el.hidden = true; return; }
  el.hidden = false;
  const n = history.length, k = report.plies.length;
  $('repProg').textContent = report.done ? '' : t('analysis', { k, n });
  const cnt = { w: {}, b: {} }, sum = { w: 0, b: 0 }, num = { w: 0, b: 0 };
  for (const p of report.plies) {
    cnt[p.col][p.cls] = (cnt[p.col][p.cls] || 0) + 1;
    sum[p.col] += Math.min(p.loss, 1000); num[p.col]++;
  }
  const acc = c => (num[c] ? Math.round(100 * Math.exp(-sum[c] / num[c] / 200)) + '%' : '—');
  let h = report.done ? '' : `<div class="bar"><i style="width:${n ? (100 * k / n) : 0}%"></i></div>`;
  h += `<table class="rep"><thead><tr><th></th><th>${t('colW')}</th><th>${t('colB')}</th></tr></thead><tbody>`;
  h += `<tr class="acc"><td>${t('acc')}</td><td>${acc('w')}</td><td>${acc('b')}</td></tr>`;

  }
  h += '</tbody></table>';
  const moments = report.plies.map((p, i) => ({ ...p, i })).filter(p => p.cls === 'brill' || p.cls === 'blun' || p.cls === 'mist');
  if (moments.length) {
    h += `<div class="key"><h3>${t('key')} <small>${t('keyHint')}</small></h3>`;
    for (const p of moments) {
      const num = Math.floor(p.i / 2) + 1 + (p.i % 2 ? '…' : '.');
      const hint = p.cls === 'brill' ? t('sacOk') : `${t('better')} ${fmt(p.bestSan)} (−${(p.loss / 100).toFixed(1)})`;
      h += `<button class="km${view === p.i ? ' on' : ''}" data-ply="${p.i}"><span class="bdg ${p.cls}">${CLS[p.cls].s}</span><span><b>${num} ${fmt(history[p.i].san)}</b> ${t('cls')[p.cls][1]}, <span class="hint">${hint}</span></span></button>`;

}

// ---------- Game state ----------
let G, history, keys, sel = null, targets = [], pendingPromo = null, flipped = false, thinking = false, dropSq = -1, resigned = null;
let ext = null; // an ending off the board: 'drawAgreed', or 'timeW' / 'timeB' for the side whose time ran out

const fx = window.gambitFx;

function insufficient(b) {

  if (pcs.length === 0) return true;
  return pcs.length === 1 && (pcs[0][1] === 'N' || pcs[0][1] === 'B');
}

function gameResult() {
  if (resigned) return { key: resigned === 'w' ? 'resW' : 'resB', over: true };
  if (ext) return { key: ext, over: true };
  const ms = legal(G);
  if (!ms.length) {

}

const aiColor = () => (modeSel.value === 'ai' ? opp(sideSel.value) : null);
const online = () => modeSel.value === 'online';
let round = 0; // bumped by "New game" so both players know to start over

// ---------- Rating ----------
// Bot strength on the Elo scale, so a win over the weak bot is worth almost nothing
const BOT_ELO = { easy: 400, medium: 1000, hard: 1500, impossible: 2000 };
const A = () => window.gambitAuth;
let rs = {}; // this game's rating state: mode, side and bot level it started with
let ratingNote = '';
function newRating() {
  rs = { mode: modeSel.value, side: sideSel.value, level: levelSel.value, unrated: '', done: false };
}
function myRatedColor() {
  if (rs.mode === 'online') return net.color();
  return rs.mode === 'ai' ? rs.side : null;
}
const ratedOppElo = () => (rs.mode === 'online' ? net.oppElo() : BOT_ELO[rs.level] || 1000);
// Smallest win against a bot: rating / 100 (+4 up to +16), and +50 for the impossible bot
const botFloor = elo => (elo >= 2000 ? 50 : Math.round(elo / 100));
// Gains against a bot count half as much again; against the impossible bot, three times
const botBoost = elo => (elo >= 2000 ? 3 : 1.5);
const ratedFloor = () => (rs.mode === 'ai' ? botFloor(BOT_ELO[rs.level] || 1000) : 0);
const ratedBoost = () => (rs.mode === 'ai' ? botBoost(BOT_ELO[rs.level] || 1000) : 1);
function noteFor(r, key) {
  if (!r) return '';
  if (r.error) return t(r.error === 'fast' ? 'rtFast' : 'rtFail');
  const d = r.delta > 0 ? `<span class="up">+${r.delta}</span>` : r.delta < 0 ? `<span class="down">${r.delta}</span>` : '±0';
  return t(key, { a: r.old, b: r.next, d });
}
function setNote(html) { ratingNote = html; $('ratingNote').innerHTML = html; }
// Called once the game is over
function finishRated() {

  if (rs.done || !me || !A() || !A().available) return;
  rs.done = true;
  if (!A().canPlay()) { if (rs.mode === 'ai') setNote(t(A().user() && !A().verified() ? 'rtVerify' : 'rtGuest')); return; }
  if (rs.unrated) { setNote(t(rs.unrated)); return; }
  const key = gameResult().key;
  const winner = WINNER[key];
  const score = winner ? (winner === me ? 1 : 0) : 0.5;
  setNote(t('rtSaving'));
  rs.ratePromise = A().rate('chess', ratedOppElo(), score, ratedFloor(), ratedBoost());
  rs.ratePromise.then(r => setNote(noteFor(r, 'rtResult')));
}
// The game goes into the player's history, with the rating change and, later, the report's accuracy
function recordGame() {
  const me = myRatedColor();
  if (rs.recorded || !me || puzzle || !A() || !A().record) return;
  rs.recorded = true; rs.recColor = me;
  const key = gameResult().key, w = WINNER[key];
  const oppInfo = rs.mode === 'online' ? net.opp() : { bot: rs.level, elo: BOT_ELO[rs.level] || 1000 };
  rs.historyRef = A().record({ game: 'chess', mode: rs.mode, opp: oppInfo, color: me, result: w ? (w === me ? 'win' : 'loss') : 'draw', key, moves: history.map(h => encMove(h.m)) }, rs.ratePromise);
}
function saveAccuracy() {
  if (!rs.historyRef || !report) return;
  const mine = report.plies.filter(p => p.col === rs.recColor);
  if (!mine.length) return;
  const acc = Math.round(100 * Math.exp(-mine.reduce((a, p) => a + Math.min(p.loss, 1000), 0) / mine.length / 200));
  const top = Math.round(100 * mine.filter(p => p.cls === 'best' || p.cls === 'brill').length / mine.length);
  A().recordAcc(rs.historyRef, acc, top);

// A win gets fanfare and confetti, a loss a sadder tune
function celebrate() {
  const me = myRatedColor(), w = WINNER[gameResult().key];
  if (!me || !w) { fx.sound('end'); return; }
  if (w === me) { fx.sound('win'); fx.confetti(rs.mode === 'online' || rs.level === 'impossible' || rs.level === 'hard'); }
  else fx.sound('lose');
}
function gameOver() {
  if (puzzle) { render(); return; }
  finishRated(); recordGame(); celebrate(); analyze();
}
// ---------- Best-move hint (admin only) ----------
// Full engine strength without the bot's randomness
// ---------- Brilliant move, live ----------
// Same test as the report: only a sacrifice can be brilliant, so the deep search runs only then
let brillMark = null; // { ply, m, sq }
function checkBrilliant(ply, m) {
  if (!history[ply] || history[ply].m !== m) return;
  const s = ply ? positionAt(ply - 1) : newGame();
  make(s, m);
  const sac = isSacrifice(s, m);
  unmake(s);
  if (!sac) return;
  let best = null, bestV = -Infinity, playedV = null;
  for (const x of legal(s)) {
    make(s, x);
    const v = clampV(-negamax(s, 2, -Infinity, Infinity, 1));
    unmake(s);
    if (v > bestV) { bestV = v; best = x; }
    if (sameMove(x, m)) playedV = v;
  }
  const loss = best && sameMove(best, m) ? 0 : Math.max(0, bestV - (playedV == null ? bestV : playedV));
  if (classify(loss, true, bestV) !== 'brill' || !history[ply] || history[ply].m !== m) return;
  brillMark = { ply, m, sq: m.to };
  if (view === null) popLabel('boardFx', m.to, flipped, `<b>!!</b>${t('fxBrill')}`);
  render();
}

// Pop a label above square `sq` of a board overlay; it fades by itself
function popLabel(fxId, sq, isFlipped, html) {
  const k = isFlipped ? 63 - sq : sq;
  const el = document.createElement('div');
  el.className = 'fx-label';
  el.style.left = ((k & 7) + 0.5) * 12.5 + '%';
  el.style.top = (k >> 3) * 12.5 + '%';
  el.innerHTML = html;
  $(fxId).appendChild(el);
  setTimeout(() => el.remove(), 2700);
}

let adminHint = null;
// The strongest move that would count as brilliant here (same scoring as checkBrilliant), or null
function findBrilliant(s) {
  const scored = legal(s).map(x => {
    make(s, x);
    const v = clampV(-negamax(s, 2, -Infinity, Infinity, 1));
    unmake(s);
    return { x, v };
  });
  if (!scored.length) return null;
  const bestV = Math.max(...scored.map(o => o.v));
  let pick = null;
  for (const o of scored) {
    if (bestV - o.v > 20 || (pick && o.v <= pick.v)) continue;
    make(s, o.x);
    const sac = isSacrifice(s, o.x);
    unmake(s);
    if (sac && classify(bestV - o.v, true, bestV) === 'brill') pick = o;
  }
  return pick ? pick.x : null;
}
function showHint() {
  if (!A() || !A().isAdmin() || thinking || gameResult().over || view !== null) return;
  $('hintNote').textContent = t('hintThinking');
  setTimeout(() => {
    const ply = history.length;
    // A sacrifice the brilliance test accepts beats the plain best move
    const deep = deepSearch(G, 1500);
    if (!deep || history.length !== ply) return;
    let m = deep.move, brill = false;
    // A sacrifice the brilliance test accepts is offered only if the deep search agrees it is as good
    const cand = findBrilliant(G);
    if (cand) {
      if (sameMove(cand, deep.move)) brill = true;
      else {
        const alt = deepSearch(G, 1200, [cand], deep.depth);
        if (alt && alt.depth >= deep.depth && alt.score >= deep.score - 20) { m = cand; brill = true; }
      }
    }
    adminHint = { ply, from: m.from, to: m.to, text: fmt(san(G, m, legal(G))), brill };
    render();
  }, 30);
}

let puzzle = null, startPos = null; // startPos: where the game began, when not the usual start
function loadPos(str) {
  const [bd, turn, cr, ep, hm] = str.split(' ');
  const b = bd.split('').map(ch => (ch === '.' ? null : (ch === ch.toUpperCase() ? 'w' : 'b') + ch.toUpperCase()));
  return { b, turn, cr: { wK: cr.includes('K'), wQ: cr.includes('Q'), bK: cr.includes('k'), bQ: cr.includes('q') }, ep: +ep, hm: +hm, stack: [] };
}
const initial = () => (startPos ? loadPos(startPos) : newGame());
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);
function puzzleSolvedToday() { try { return localStorage.getItem('gambit-puzzle') === String(today()); } catch (e) { return false; } }
function startPuzzle() {
  if (!PUZZLES.length || thinking) return;
  abandonRated();
  if (online()) net.leave();
  const prevMode = modeSel.value === 'online' ? 'ai' : modeSel.value;
  modeSel.value = 'pvp';
  const day = today(), p = PUZZLES[day % PUZZLES.length];
  reset(false);
  startPos = p.p; G = loadPos(p.p); keys = [posKey(G)];
  puzzle = { p, k: 0, state: 'play', msg: '', day, prevMode };
  flipped = G.turn === 'b';
  render();
}
function exitPuzzle() {
  if (!puzzle) return;
  modeSel.value = puzzle.prevMode;
  reset(false);
}
// The player's move: the planned one (or any mate) goes ahead, anything else is refused
function puzzleTry(m) {
  const pz = puzzle;
  if (encMove(m) === pz.p.s[pz.k]) { pz.k++; pz.msg = ''; return true; }
  make(G, m);
  const mate = !legal(G).length && inCheck(G, G.turn);
  unmake(G);
  if (mate) { pz.k = pz.p.s.length; return true; }
  pz.msg = 'bad'; fx.sound('wrong');
  sel = null; targets = []; pendingPromo = null;
  render();
  return false;
}
// After a correct move: the solution is complete, or the opponent answers
function puzzleAfter() {
  const pz = puzzle;
  if (!pz || pz.state !== 'play') return;
  if (pz.k >= pz.p.s.length) { finishPuzzle(true); return; }
  pz.msg = 'good'; render();
  setTimeout(() => {
    if (puzzle !== pz || pz.state !== 'play') return;
    const r = legal(G).find(x => encMove(x) === pz.p.s[pz.k]);
    if (!r) { finishPuzzle(true); return; }
    pz.k++; play(r, true);
  }, 500);
}
function finishPuzzle(solved) {
  const pz = puzzle;
  pz.state = solved ? 'solved' : 'shown';
  if (solved) {
    try { localStorage.setItem('gambit-puzzle', String(pz.day)); } catch (e) {}
    fx.sound('win'); fx.confetti(false);
  }
  render();
}
function showSolution() {
  const pz = puzzle;
  if (!pz || pz.state !== 'play') return;
  pz.state = 'showing'; pz.msg = '';
  const step = () => {
    if (puzzle !== pz) return;
    const m = pz.k < pz.p.s.length && legal(G).find(x => encMove(x) === pz.p.s[pz.k]);
    if (!m) { finishPuzzle(false); return; }
    pz.k++; play(m, true);
    setTimeout(step, 700);
  };
  step();
}
function renderPuzzle() {
  const el = $('puzzleBar'), btn = $('puzzleBtn');
  btn.hidden = !PUZZLES.length;
  btn.textContent = t('pzBtn') + (puzzleSolvedToday() ? ' ✓' : '');
  if (!puzzle) { el.hidden = true; return; }
  el.hidden = false;
  const pz = puzzle;
  const msg = pz.state === 'solved' ? `<div class="pm good">${t('pzSolved')}</div>`
    : pz.state === 'shown' ? `<div class="pm">${t('pzShown')}</div>`
    : pz.msg === 'bad' ? `<div class="pm bad">${t('pzWrong')}</div>`
    : pz.msg === 'good' ? `<div class="pm good">${t('pzRight')}</div>` : '';
  el.innerHTML = `<div class="pt">${t('pzTitle', { n: pz.day % PUZZLES.length + 1 })}</div>
    <div class="pm">${t(pz.p.c === 'w' ? 'pzTaskW' : 'pzTaskB')}${pz.p.b ? ' ' + t('pzBrill') : ''}</div>${msg}
    <div class="btns">${pz.state === 'play' ? `<button class="b" data-pz="show">${t('pzShow')}</button>` : ''}<button class="b" data-pz="exit">${t('pzExit')}</button></div>`;
}

// A game from the history: replayed into two-player mode, so nothing is rated, and analysed
function loadRecord(e) {
  abandonRated();
  net.leave();
  modeSel.value = 'pvp';
  reset(false);
  for (const a of e.moves || []) {
    const all = legal(G), m = all.find(x => encMove(x) === a);
    if (!m) break;
    const n = san(G, m, all); make(G, m); history.push({ m, san: n }); keys.push(posKey(G));
  }
  if (!gameResult().over) {
    if (e.key === 'resW' || e.key === 'resB') resigned = e.key === 'resW' ? 'w' : 'b';
    else if (['drawAgreed', 'timeW', 'timeB'].includes(e.key)) ext = e.key;
  }
  flipped = e.color === 'b';
  setNote(t('hiReview'));
  if (gameResult().over) analyze(); else render();
}
window.gambitChessLoad = loadRecord;

// Leaving a rated game half-way counts as a loss, so nobody dodges a bad position
function abandonRated() {
  const me = myRatedColor();
  if (rs.done || rs.unrated || !me || !A() || !A().canPlay() || gameResult().over) return;
  if (history.filter(h => h.m.p[0] === me).length < 2) return;
  rs.done = true;
  A().rate('chess', ratedOppElo(), 0).then(r => setNote(noteFor(r, 'rtAbandon')));
}
const net = window.gambitNet.create('chess', $('onlineBox'), {
  side: () => sideSel.value,
  start: () => { round = 0; reset(false); },
  getState: () => ({ round, resigned, moves: history.map(h => encMove(h.m)) }),
  applyState: st => {
    if (typeof st.round !== 'number' || !Array.isArray(st.moves) || st.round < round) return;
    if (st.round > round) { round = st.round; reset(false); }
    // Our moves must be the start of theirs; then catch up on whatever is missing
    const same = (a, m) => a === encMove(m);
    if (st.moves.length < history.length || !history.every((h, i) => same(st.moves[i], h.m))) return;
    for (let i = history.length; i < st.moves.length; i++) {
      const a = st.moves[i];
      const m = !gameResult().over && legal(G).find(x => same(a, x));
      if (!m) break;
      play(m, true);
    }
    if ((st.resigned === 'w' || st.resigned === 'b') && !gameResult().over) { resigned = st.resigned; gameOver(); }
  },
  change: () => render(),
  round: () => round,
  over: () => gameResult().over,
  external: (key, loser) => {
    if (gameResult().over) return;
    ext = key === 'draw' ? 'drawAgreed' : loser === 'w' ? 'timeW' : 'timeB';
    sel = null; targets = []; pendingPromo = null;
    gameOver();
  },
  newRound: () => { round++; reset(false); net.push(); },
  enter: show => { if (show && window.gambitSetGame) window.gambitSetGame('chess'); modeSel.value = 'online'; reset(false); }
});

function reset(keepFlip) {
  G = newGame(); history = []; keys = [posKey(G)]; sel = null; targets = []; pendingPromo = null; dropSq = -1;
  resigned = null; ext = null; report = null; anToken++; view = null; puzzle = null; startPos = null; slideMv = null;
  newRating(); setNote(''); adminHint = null; brillMark = null;
  if (!keepFlip) flipped = online() ? net.color() === 'b' : modeSel.value === 'ai' && sideSel.value === 'b';
  render(); maybeAI(); maybeAuto();
}

function play(m, remote) {
  const pzMove = !!(puzzle && puzzle.state === 'play' && !remote);
  if (pzMove && !puzzleTry(m)) return;
  const all = legal(G);
  const notation = san(G, m, all);
  make(G, m);
  history.push({ m, san: notation });
  keys.push(posKey(G));
  fx.sound(inCheck(G, G.turn) ? 'check' : m.cap ? 'capture' : 'move');
  slideMv = { from: m.from, to: m.to };
  // A person's move (not the bot's) gets checked for brilliance in the background
  if (m.p[0] !== aiColor()) { const ply = history.length - 1; setTimeout(() => checkBrilliant(ply, m), 30); }
  if (online() && !remote) net.push();
  sel = null; targets = []; dropSq = m.to; view = null;
  if (gameResult().over) { gameOver(); if (pzMove) puzzleAfter(); return; }
  render();
  maybeAI();
  maybeAuto();
  if (pzMove) puzzleAfter();
}

function maybeAI() {
  if (G.turn !== aiColor() || gameResult().over) return;
  thinking = true; render();
  setTimeout(() => {
    const m = botMove(G, levelSel.value);
    thinking = false;
    if (m) play(m); else render();
  }, 450);
}

function resign() {
  if (thinking || !history.length || gameResult().over || (online() && !net.active())) return;
  resigned = online() ? net.color() : aiColor() ? sideSel.value : G.turn;
  sel = null; targets = []; pendingPromo = null;
  gameOver();
  if (online()) net.push();
}

function undo() {
  if (thinking || !history.length || online()) return;
  resigned = null; report = null; anToken++; view = null;
  if (!rs.done) rs.unrated = 'rtUndo';
  setNote(t('rtUndo'));
  // Against the computer, step back to the player's own turn
  do { unmake(G); history.pop(); keys.pop(); } while (history.length && G.turn === aiColor());
  sel = null; targets = []; pendingPromo = null; dropSq = -1;
  render(); maybeAI();
}

function onSquare(i) {
  if (thinking || pendingPromo || autoBusy) return;
  if (view !== null) { showPly(null); return; }
  const res = gameResult();
  if (res.over || G.turn === aiColor() || (online() && G.turn !== net.color())) return;
  const p = G.b[i];
  if (sel !== null) {
    const choices = targets.filter(m => m.to === i);
    if (choices.length) {
      if (choices.length > 1) { pendingPromo = choices; render(); return; }
      play(choices[0]); return;
    }
  }
  if (p && p[0] === G.turn && sel !== i) {
    sel = i; targets = res.moves.filter(m => m.from === i);
  } else { sel = null; targets = []; }
  render();
}

const boardEl = $('board');
function pieceHTML(p) { return `<svg class="pc ${p[0]}" viewBox="0 0 45 45" aria-hidden="true">${SHAPE[p[1]]}${BASE}</svg>`; }

function showPly(i) {
  if (i !== null && (i < 0 || i >= history.length)) return;
  if (i === history.length - 1 && !gameResult().over) i = null;
  view = i; sel = null; targets = [];

}

// Position after move `ply`, replayed from the start
function positionAt(ply) {
  const s = initial();
  for (let i = 0; i <= ply; i++) make(s, history[i].m);
  return s;
}

function renderReview() {

  const num = Math.floor(view / 2) + 1 + (view % 2 ? '…' : '.');
  let txt = `<b>${num} ${fmt(history[view].san)}</b>`;
  if (p) {
    txt += ` <span class="bdg ${p.cls}">${CLS[p.cls].s || '✓'}</span> ${t('cls')[p.cls][1]}`;
    if (!p.isBest && p.cls !== 'brill') txt += `<span class="hint">, ${t('better')} <b>${fmt(p.bestSan)}</b> (${t('greenBox')})</span>`;
  }
  $('revText').innerHTML = txt;
  $('revPrev').disabled = view <= 0;
  $('revNext').disabled = view >= history.length - 1;
}

<script>
// ---------- Russian draughts ----------
(() => {
'use strict';
const $ = id => document.getElementById(id);
const t = (k, v) => window.gambitI18n.t(k, v);
const FILES = 'abcdefgh', sqName = i => FILES[i & 7] + (8 - (i >> 3));
const DIRS = [[-1, -1], [-1, 1], [1, -1], [1, 1]];

// All complete capture sequences from `sq`. Captured pieces stay on the board until the move ends

    } else {
      let r1 = r + dr, c1 = c + dc;
      while (onB(r1, c1) && !b[r1 * 8 + c1]) { r1 += dr; c1 += dc; }
      if (!onB(r1, c1)) continue;
      const mid = r1 * 8 + c1;
      if (colorOf(b[mid]) !== opp(col) || capt.includes(mid)) continue;
      const subs = [];
      let r2 = r1 + dr, c2 = c1 + dc;
      while (onB(r2, c2) && !b[r2 * 8 + c2]) {
        const land = r2 * 8 + c2;
        subs.push(jumps(b, land, p, col, [...path, land], [...capt, mid], true));
        r2 += dr; c2 += dc;
      }
      // A king must land where it can keep capturing, if such a square exists
      const cont = subs.filter(s => s[0].path.length > path.length + 1);
      for (const s of (cont.length ? cont : subs)) out.push(...s);
    }

}

function genMoves(b, col) {
  let caps = [];
  for (let i = 0; i < 64; i++) {
    const p = b[i];
    if (colorOf(p) !== col) continue;
    const b2 = b.slice(); b2[i] = null;
    caps = caps.concat(jumps(b2, i, p, col, [i], [], false));
  }
  if (caps.length) return caps;
  const ms = [];
  for (let i = 0; i < 64; i++) {
    const p = b[i];
    if (colorOf(p) !== col) continue;
    const r = i >> 3, c = i & 7;
    for (const [dr, dc] of DIRS) {

        const r1 = r + dr, c1 = c + dc, to = r1 * 8 + c1;
        if (onB(r1, c1) && !b[to]) ms.push({ from: i, to, path: [i, to], caps: [], promo: r1 === lastRow(col) });
      } else {
        let r1 = r + dr, c1 = c + dc;
        while (onB(r1, c1) && !b[r1 * 8 + c1]) {
          const to = r1 * 8 + c1;
          ms.push({ from: i, to, path: [i, to], caps: [], promo: false });
          r1 += dr; c1 += dc;

}

function apply(b, m) {

  return nb;
}

const notation = m => m.path.map(sqName).join(m.caps.length ? ':' : '-');

// ---------- Bot ----------
function evaluate(b, col) {
  let s = 0;
  for (let i = 0; i < 64; i++) {
    const p = b[i];

    const r = i >> 3, c = i & 7;

  for (const m of ms) {
    const v = -negamax(apply(b, m), opp(col), depth - 1, -beta, -alpha, ply + 1);
    if (v >= beta) return beta;
    if (v > alpha) alpha = v;
  }
  return alpha;
}

function searchMove(b, col, depth, noise) {
  const ms = genMoves(b, col);
  let best = ms[0], bestV = -Infinity;
  for (const m of ms) {
    const v = -negamax(apply(b, m), opp(col), depth - 1, -Infinity, Infinity, 1) + (Math.random() - 0.5) * 2 * noise;
    if (v > bestV) { bestV = v; best = m; }
  }

}

// ---------- Strong search for the admin's hint ----------
// Iterative deepening under a time budget with a transposition table; the bots keep their own search

      if (tt.flag === 1 && tt.v >= beta) return tt.v;
      if (tt.flag === -1 && tt.v <= alpha) return tt.v;

      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }

    return best;
  }

  try {
    for (let d = 1; d <= maxDepth; d++) {
      if (result) roots.sort((x, y) => (pk(y) === pk(result.move) ? 1 : 0) - (pk(x) === pk(result.move) ? 1 : 0));

        if (v > bs) { bs = v; bm = m; }
        if (v > alpha) alpha = v;
      }

      if (Math.abs(bs) > 9000) break; // a forced win or loss was found
    }
  } catch (e) {
    if (e !== CK_STOP) throw e;
  }

}

function botMove(b, col, level) {
  const ms = genMoves(b, col);
  if (!ms.length) return null;
  if (level === 'easy') return ms[Math.floor(Math.random() * ms.length)];
  if (level === 'medium') return Math.random() < 0.15 ? ms[Math.floor(Math.random() * ms.length)] : searchMove(b, col, 3, 40);

const modeSel = $('ckMode'), sideSel = $('ckSide'), levelSel = $('ckLevel'), boardEl = $('ckBoard');

let resigned = null, ext = null, slideMv = null; // ext: 'drawAgreed', 'timeW' or 'timeB', as in chess
const fx = window.gambitFx;
const WINNER = { ckWinW: 'w', resB: 'w', timeB: 'w', ckWinB: 'b', resW: 'b', timeW: 'b' };

const A = () => window.gambitAuth;
let rs = {}, ratingNote = '';

const ratedOppElo = () => (rs.mode === 'online' ? net.oppElo() : BOT_ELO[rs.level] || 1000);
// Smallest win against a bot: rating / 100 (+4 up to +16), and +50 for the impossible bot
const botFloor = elo => (elo >= 2000 ? 50 : Math.round(elo / 100));
// Gains against a bot count half as much again; against the impossible bot, three times
const botBoost = elo => (elo >= 2000 ? 3 : 1.5);
const ratedFloor = () => (rs.mode === 'ai' ? botFloor(BOT_ELO[rs.level] || 1000) : 0);
const ratedBoost = () => (rs.mode === 'ai' ? botBoost(BOT_ELO[rs.level] || 1000) : 1);

  rs.ratePromise.then(r => setNote(noteFor(r, 'rtResult')));
}

  const me = myRatedColor();
  if (rs.recorded || !me || !A() || !A().record) return;
  rs.recorded = true; rs.recColor = me;

  if (!scored.length) return null;
  const bestV = Math.max(...scored.map(o => o.v));

  for (const o of scored) {

function analyze() {

    const h = hist[i], ms = genMoves(h.b, h.turn);

  $('ckAutoFastBtn').textContent = t('autoFast');
  $('ckAutoFastBtn').setAttribute('aria-pressed', String(isAutoFast()));
  $('ckHintNote').textContent = liveHint ? t(liveHint.brill ? 'hintBrill' : 'hintIs', { m: liveHint.text }) : '';
  $('ckHintNote').classList.toggle('brill', !!(liveHint && liveHint.brill));
}

boardEl.addEventListener('click', e => {
  const sq = e.target.closest('[data-i]');
  if (sq) onSquare(+sq.dataset.i);
});
$('ckNew').addEventListener('click', () => {
  if (thinking) return;
  if (online() && (net.active() || net.spectating())) { $('ckOnlineBox').querySelector('[data-act="rematch"]')?.click(); return; }
  abandonRated();
  reset();
});
$('ckResign').addEventListener('click', resign);
$('ckUndo').addEventListener('click', undo);
for (const id of ['ckMoves', 'ckRepBody']) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('[data-ply]');
    if (b && !thinking) showPly(+b.dataset.ply);
  });
}
$('ckRevPrev').addEventListener('click', () => showPly(view - 1));
$('ckRevNext').addEventListener('click', () => showPly(view + 1));
$('ckRevExit').addEventListener('click', () => showPly(null));
document.addEventListener('keydown', e => {
  if ($('checkersApp').hidden || e.target.closest('select, input') || !hist.length || thinking) return;
  const cur = view === null ? hist.length - 1 : view;
  if (e.key === 'ArrowLeft') { e.preventDefault(); showPly(Math.max(0, cur - 1)); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); if (view !== null) showPly(view + 1 >= hist.length ? null : view + 1); }
  else if (e.key === 'Escape' && view !== null) showPly(null);
});
$('ckFlip').addEventListener('click', () => { flipped = !flipped; render(); });
if (!window.gambitNet.available) modeSel.querySelector('[value=online]').remove();
modeSel.addEventListener('change', () => { abandonRated(); if (!online()) net.leave(); if (!thinking) reset(); });
sideSel.addEventListener('change', () => { abandonRated(); if (!thinking) reset(); });
levelSel.addEventListener('change', () => {
  if (!hist.length) rs.level = levelSel.value;
  else if (!rs.done && !result().over) { rs.unrated = 'rtLevel'; setNote(t('rtLevel')); }
  render();
});
document.addEventListener('gambit-lang', render);
$('ckHintBtn').addEventListener('click', showHint);
$('ckAutoBtn').addEventListener('click', () => { autoOn = !autoOn; render(); maybeAuto(); });
$('ckAutoFastBtn').addEventListener('click', toggleAutoFast);
window.gambitAuth.onChange(() => render());

// ---------- Game switch ----------
const tagEl = document.querySelector('header .tag');
let currentGame = 'chess';
function setGame(g) {
  g = g || currentGame; currentGame = g;
  $('adminApp').hidden = true;
  $('chessApp').hidden = g !== 'chess';
  $('checkersApp').hidden = g !== 'checkers';
  for (const b of document.querySelectorAll('[data-game]')) b.setAttribute('aria-pressed', String(b.dataset.game === g));
  tagEl.dataset.t = g === 'chess' ? 'tag' : 'ckTag';
  window.gambitI18n.apply();
  document.dispatchEvent(new Event('gambit-game'));
  try { localStorage.setItem('gambit-game', g); } catch (e) {}
}
for (const b of document.querySelectorAll('[data-game]')) b.addEventListener('click', () => setGame(b.dataset.game));

// ---------- Board theme ----------
const themeSel = $('boardTheme');
try { const th = localStorage.getItem('gambit-board'); if (th && themeSel.querySelector(`[value="${th}"]`)) themeSel.value = th; } catch (e) {}
function applyBoardTheme() {
  document.documentElement.dataset.board = themeSel.value;
  try { localStorage.setItem('gambit-board', themeSel.value); } catch (e) {}
}
themeSel.addEventListener('change', applyBoardTheme);
applyBoardTheme();

reset();
let saved = 'chess';
try { if (localStorage.getItem('gambit-game') === 'checkers') saved = 'checkers'; } catch (e) {}
setGame(saved);
window.gambitSetGame = setGame;
window.gambitCkLoad = loadRecord;
// A game picked from the profile's history
window.gambitOpenRecord = e => {
  const g = e.game === 'checkers' ? 'checkers' : 'chess';
  setGame(g);
  (g === 'checkers' ? window.gambitCkLoad : window.gambitChessLoad)(e);
};
window.gambitCurrentGame = () => currentGame;
window.gambitAuth.init();
const q = new URLSearchParams(location.search);
window.gambitNet.autoJoin(q.get('game') === 'checkers' ? 'checkers' : 'chess', q.get('join'));
})();
</script>
</body>
</html>
