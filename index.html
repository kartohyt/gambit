<style>
/* Layout: board as the hero on the left, a narrow "scoresheet" column on the right; stacks on phones. */

}

    --accent: #f0a742; --frame: #070a10; color-scheme: dark;

}
:root[data-theme="dark"] {
  --bg: #10141c; --panel: #181e2a; --fg: #e6eaf1; --muted: #8f9aae; --line: #2a3344;

}

}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }

  display: flex; gap: 8px; align-items: baseline; text-align: left; padding: 4px 6px; margin: 0 -6px;
}

  padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
}

  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}

}

.warn { color: var(--danger); font-size: .88rem; }

/* Brilliant move: a lasting !! on the square and a label that pops up and fades */
.brill-dot {
  position: absolute; top: 4%; right: 4%; z-index: 3; width: 34%; height: 34%; border-radius: 50%;
  display: grid; place-items: center; background: #1d9e98; color: #fff; pointer-events: none;
  font-family: var(--f-mono); font-weight: 700; font-size: 2.4cqw; box-shadow: 0 2px 6px rgba(0, 0, 0, .35);

<script>
// ---------- Accounts and the admin panel (Firebase Auth + Firestore) ----------
// The page only shows what the Firestore rules allow; bans and admin rights are enforced there.
window.gambitAuth = (() => {
  'use strict';
  const t = (k, v) => window.gambitI18n.t(k, v);
  const $ = id => document.getElementById(id);
  const cfg = window.GAMBIT_FIREBASE;
  const available = !!(cfg && window.firebase && !window.claude);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let auth = null, db = null, user = null, profile = null, admin = false, ready = false;
  const readyWaiters = [], changeListeners = [];
  let afterLogin = null;

  const ts = () => window.firebase.firestore.FieldValue.serverTimestamp();
  const emit = () => { for (const f of changeListeners) f(); };

  function errText(e) {
    const code = (e && e.code) || '';
    const map = {
      'auth/email-already-in-use': 'aeEmailUsed', 'auth/invalid-email': 'aeEmailBad', 'auth/weak-password': 'aeWeak',
      'auth/invalid-credential': 'aeWrong', 'auth/wrong-password': 'aeWrong', 'auth/user-not-found': 'aeWrong',
      'auth/invalid-login-credentials': 'aeWrong', 'auth/too-many-requests': 'aeTooMany', 'auth/network-request-failed': 'aeNetwork',
      'auth/missing-password': 'aeWeak', 'nick-taken': 'aeNickTaken', 'nick-bad': 'aeNickBad', 'nick-reserved': 'aeNickReserved',
      'permission-denied': 'aeDenied', 'unavailable': 'aeNetwork'
    };
    return map[code] ? t(map[code]) : t('aeOther', { e: code || (e && e.message) || String(e) });
  }

  // Sign-up loads the profile twice at once (sign-in event and profile creation): only the latest load counts
  let loadSeq = 0;
  async function loadProfile(u) {
    const mine = ++loadSeq;
    let p = null, a = false;
    try {
      const snap = await db.collection('users').doc(u.uid).get();
      if (snap.exists) {
        p = snap.data();
        db.collection('users').doc(u.uid).update({ lastSeen: ts() }).catch(() => {});
      }
      // Only the admin may list players, so a successful read means admin rights
      a = await db.collection('users').limit(1).get().then(() => true, () => false);
    } catch (e) {}
    if (mine === loadSeq) { profile = p; admin = a; }
  }

  async function createProfile(nick, country) {
    const u = auth.currentUser, lower = nick.toLowerCase();
    const batch = db.batch();
    batch.set(db.collection('nicks').doc(lower), { uid: u.uid });
    batch.set(db.collection('users').doc(u.uid), {
      nick, nickLower: lower, createdAt: ts(), lastSeen: ts(), games: 0, banned: false,
      country: country || '', elo: { chess: 1000, checkers: 1000 }, rated: { chess: 0, checkers: 0 }
    });
    try { await batch.commit(); }
    catch (e) {
      if (e.code === 'permission-denied') {
        const taken = await db.collection('nicks').doc(lower).get().catch(() => null);
        const err = new Error(); err.code = taken && taken.exists ? 'nick-taken' : lower === 'itzkartoh' ? 'nick-reserved' : 'permission-denied';
        throw err;
      }
      throw e;
    }
    await loadProfile(u);
  }

  // ---------- Ratings and the player badge ----------
  const COUNTRIES = 'ad ae af ag ai al am ao ar as at au aw ax az ba bb bd be bf bg bh bi bj bl bm bn bo br bs bt bw by bz ca cd cf cg ch ci ck cl cm cn co cr cu cv cw cy cz de dj dk dm do dz ec ee eg er es et fi fj fk fm fo fr ga gb gd ge gg gh gi gl gm gn gq gr gt gu gw gy hk hn hr ht hu id ie il im in iq ir is it je jm jo jp ke kg kh ki km kn kp kr kw ky kz la lb lc li lk lr ls lt lu lv ly ma mc md me mg mh mk ml mm mn mo mp mr ms mt mu mv mw mx my mz na nc ne ng ni nl no np nr nu nz om pa pe pf pg ph pk pl pr ps pt pw py qa re ro rs ru rw sa sb sc sd se sg si sk sl sm sn so sr ss st sv sx sy sz tc td tg th tj tl tm tn to tr tt tv tw tz ua ug us uy uz va vc ve vg vi vn vu ws xk ye za zm zw'.split(' ');
  const eloOf = (p, game) => (p && p.elo && p.elo[game]) || 1000;
  const ratedOf = (p, game) => (p && p.rated && p.rated[game]) || 0;
  function regionName(cc) {
    try { return new Intl.DisplayNames([document.documentElement.lang || 'ru'], { type: 'region' }).of(cc.toUpperCase()); }
    catch (e) { return cc.toUpperCase(); }
  }
  function flag(cc) {
    if (!/^[a-z]{2}$/.test(cc || '')) return '';
    const name = esc(regionName(cc));
    return `<img class="flag" src="https://flagcdn.com/w20/${cc}.png" srcset="https://flagcdn.com/w40/${cc}.png 2x" width="20" height="15" alt="${name}" title="${name}">`;
  }
  // ADMIN Kartoh (1000) [flag]
  function badge(p) {
    return `<span class="player">${p.admin ? '<span class="title-badge">ADMIN</span>' : ''}<span class="bn">${esc(p.nick)}</span>`
      + `<span class="belo">(${p.elo == null ? 1000 : p.elo})</span>${flag(p.country)}</span>`;
  }
  function countrySelect(id, value) {
    const opts = COUNTRIES.map(c => [c, regionName(c)]).sort((a, b) => a[1].localeCompare(b[1]));
    return `<label class="field" for="${id}">${t('acCountry')}<select id="${id}"><option value="">${t('acNoCountry')}</option>`
      + opts.map(([c, n]) => `<option value="${c}"${c === value ? ' selected' : ''}>${esc(n)}</option>`).join('') + '</select></label>';
  }
  function guessCountry() {
    const m = /-([A-Za-z]{2})$/.exec(navigator.language || '');
    const c = m ? m[1].toLowerCase() : '';
    return COUNTRIES.includes(c) ? c : '';
  }
  // Standard Elo: K = 40 for the first 20 games, then 20. Against a bot (`floor` > 0) any gain is
  // multiplied by `boost` and a win is worth at least `floor`, both growing with the bot's
  // strength; losses stay as they are. Never more than 60, the cap the database rules enforce.
  const ELO_CAP = 60;
  function eloDelta(game, oppElo, score, floor, boost = 1.5) {
    const old = eloOf(profile, game), n = ratedOf(profile, game);
    const K = n < 20 ? 40 : 20;
    const expected = 1 / (1 + Math.pow(10, (oppElo - old) / 400));
    let d = Math.round(K * (score - expected));
    if (floor && d > 0) d = Math.round(d * boost);
    if (score === 1 && floor) d = Math.max(d, floor);
    d = Math.max(-ELO_CAP, Math.min(ELO_CAP, d));
    return Math.max(100, Math.min(3500, old + d)) - old;
  }
  // ---------- Public leaderboard entry ----------
  // A copy of the rating, nick and flag that anyone may read; the rules check it against the profile
  async function syncLeader() {
    if (!user || !profile || profile.banned) return;
    const elo = { chess: eloOf(profile, 'chess'), checkers: eloOf(profile, 'checkers') };
    const rated = { chess: ratedOf(profile, 'chess'), checkers: ratedOf(profile, 'checkers') };
    try { await db.collection('leaders').doc(user.uid).set({ nick: profile.nick, country: profile.country || '', admin, elo, rated, seen: ts() }); } catch (e) {}
  }

  // ---------- Game history ----------
  // A finished game against the bot or online, saved with the rating change once it is known
  async function record(entry, ratePromise) {
    if (!user || !profile) return null;
    const r = ratePromise ? await ratePromise.catch(() => null) : null;
    // Firestore refuses undefined fields, so drop them
    const doc = { ...JSON.parse(JSON.stringify(entry)), delta: r && typeof r.delta === 'number' ? r.delta : null, eloAfter: r && typeof r.next === 'number' ? r.next : null, at: ts(), acc: null, top: null };
    try { histList = null; return await db.collection('users').doc(user.uid).collection('history').add(doc); } catch (e) { return null; }
  }
  // The report's accuracy and share of best moves, added when the analysis is done
  function recordAcc(refPromise, acc, top) {
    Promise.resolve(refPromise).then(ref => { if (ref) ref.update({ acc, top }).catch(() => {}); });
  }
  let histList = null;
  async function loadHistory() {
    if (!user) return;
    histList = 'loading';
    try {
      const snap = await db.collection('users').doc(user.uid).collection('history').orderBy('at', 'desc').limit(30).get();
      histList = snap.docs.map(d => d.data());
    } catch (e) { histList = []; }
    if (mode === 'profile' && !$('authModal').hidden) drawModal();
  }
  function historyHTML() {
    if (!Array.isArray(histList)) return `<div class="hint">${t('adLoading')}</div>`;
    if (!histList.length) return `<div class="hint">${t('hiNone')}</div>`;
    return '<div class="hlist">' + histList.map((h, i) => {
      const o = h.opp || {};
      const who = o.bot ? esc(t('hiBot', { l: t(o.bot), e: o.elo })) : badge({ nick: o.nick || '?', elo: o.elo, country: o.country, admin: o.admin });
      const d = typeof h.delta !== 'number' ? '' : h.delta > 0 ? `<span class="up">+${h.delta}</span>` : h.delta < 0 ? `<span class="down">${h.delta}</span>` : '±0';
      return `<button type="button" class="hrow" data-h="${i}"><span class="res ${esc(h.result)}">${t('hi_' + h.result)}</span>`
        + `<span>${h.game === 'checkers' ? '⛀' : '♞'} ${who}</span><span>${d}</span>`
        + `<span class="hs">${fmtDate(h.at)} · ${t(h.mode === 'online' ? 'hiOnline' : 'hiAi')}${typeof h.acc === 'number' ? ' · ' + t('acc') + ' ' + h.acc + '%' : ''} · ${t('hiOpen')}</span></button>`;
    }).join('') + '</div>';
  }

  async function rate(game, oppElo, score, floor = 0, boost = 1.5) {
    if (!(user && profile && !profile.banned)) return null;
    const old = eloOf(profile, game), n = ratedOf(profile, game);
    const next = old + eloDelta(game, oppElo, score, floor, boost);
    const elo = { chess: eloOf(profile, 'chess'), checkers: eloOf(profile, 'checkers'), [game]: next };
    const rated = { chess: ratedOf(profile, 'chess'), checkers: ratedOf(profile, 'checkers'), [game]: n + 1 };
    try {
      await db.collection('users').doc(user.uid).update({ elo, rated, lastRated: ts() });
      profile.elo = elo; profile.rated = rated;
      renderAcct(); emit(); syncLeader();
      return { old, next, delta: next - old };
    } catch (e) {
      return { error: e.code === 'permission-denied' ? 'fast' : 'fail' };
    }
  }
  const currentGame = () => (window.gambitCurrentGame ? window.gambitCurrentGame() : 'chess');

  function checkNick(nick) {
    if (!/^[A-Za-z0-9_]{3,16}$/.test(nick)) { const e = new Error(); e.code = 'nick-bad'; throw e; }
  }

  // ---------- Header ----------
  function renderAcct() {
    const el = $('acct');
    if (!available) { el.hidden = true; return; }
    el.hidden = false;
    if (!ready) { el.innerHTML = ''; return; }
    if (!user) { el.innerHTML = `<button class="b" data-a="login">${t('acLogin')}</button>`; return; }
    const name = profile
      ? badge({ nick: profile.nick, elo: eloOf(profile, currentGame()), country: profile.country, admin })
      : esc(user.email);
    el.innerHTML = `<span class="who${profile && profile.banned ? ' banned' : ''}" title="${esc(user.email)}">${name}${profile && profile.banned ? ' · ' + t('acBanned') : ''}</span>`
      + (!profile ? `<button class="b primary" data-a="finish">${t('acFinish')}</button>` : `<button class="b" data-a="profile">${t('acProfile')}</button>`)
      + (profile && !user.emailVerified ? `<button class="b danger" data-a="verify">${t('vfBtn')}</button>` : '')
      + (admin ? `<button class="b" data-a="admin">${t('acAdmin')}</button>` : '')
      + `<button class="b" data-a="logout">${t('acLogout')}</button>`;
  }

  // ---------- Sign-in dialog ----------
  let mode = 'login', msg = '', msgOk = false, busy = false;
  function openModal(m) { mode = m || (user && !profile ? 'nick' : 'login'); msg = ''; drawModal(); $('authModal').hidden = false; setTimeout(() => { const f = $('authModal').querySelector('input'); if (f) f.focus(); }, 30); }
  function closeModal() { $('authModal').hidden = true; }
  function drawModal() {
    const box = $('authBox');
    box.classList.toggle('wide', mode === 'profile');
    const tabs = mode === 'nick' || mode === 'profile' || mode === 'verify' ? '' : `<div class="tabs" role="tablist">
        <button class="b" role="tab" data-m="login" aria-selected="${mode === 'login'}">${t('acLogin')}</button>
        <button class="b" role="tab" data-m="register" aria-selected="${mode === 'register'}">${t('acRegister')}</button></div>`;
    const f = (id, type, label, ac, extra = '') => `<label class="field" for="${id}">${label}<input id="${id}" type="${type}" autocomplete="${ac}" ${extra}></label>`;
    let body = '';
    if (mode === 'login') body = f('auEmail', 'email', t('acEmail'), 'email') + f('auPass', 'password', t('acPass'), 'current-password');
    else if (mode === 'register') body = f('auNick', 'text', t('acNick'), 'username', 'maxlength="16"') + `<div class="hint">${t('acNickHint')}</div>`
      + countrySelect('auCountry', guessCountry())
      + f('auEmail', 'email', t('acEmail'), 'email') + f('auPass', 'password', t('acPass'), 'new-password') + `<div class="hint">${t('acPassHint')}</div>`;
    else if (mode === 'verify') body = `<p class="hint">${esc(t('vfText', { e: user ? user.email : '' }))}</p><p class="hint">${t('vfWhy')}</p>`;
    else if (mode === 'profile') body = `<div>${badge({ nick: profile.nick, elo: eloOf(profile, currentGame()), country: profile.country, admin })}</div>`
      + countrySelect('auCountry', profile.country || '');
    else body = `<p class="hint">${t('acNickStep')}</p>` + f('auNick', 'text', t('acNick'), 'username', 'maxlength="16"') + `<div class="hint">${t('acNickHint')}</div>`
      + countrySelect('auCountry', guessCountry());
    const label = mode === 'login' ? t('acLogin') : mode === 'register' ? t('acCreate') : mode === 'verify' ? t('vfDone') : t('acSave');
    box.innerHTML = `<div class="modal-head"><h2 id="authTitle">${mode === 'nick' ? t('acFinish') : mode === 'profile' ? t('acProfile') : mode === 'verify' ? t('vfTitle') : t('acTitle')}</h2>
        <button class="b x" data-a="close" aria-label="${t('cancel')}">×</button></div>${tabs}
      <form id="authForm" class="auth-form">${body}
        ${msg ? `<div class="${msgOk ? 'okmsg' : 'warn'}" role="alert">${esc(msg)}</div>` : ''}
        <button class="b primary" ${busy ? 'disabled' : ''}>${busy ? '…' : label}</button>
        ${mode === 'login' ? `<button type="button" class="linkbtn" data-a="reset">${t('acForgot')}</button>` : ''}
        ${mode === 'verify' ? `<button type="button" class="linkbtn" data-a="resend">${t('vfResend')}</button>` : ''}
      </form>${mode === 'profile' ? `<div class="sheet-h"><h2>${t('hiTitle')}</h2></div>${historyHTML()}` : ''}`;
  }
  async function submit() {
    // Read the form before redrawing it: the redraw replaces the inputs
    const v = id => ($(id) ? $(id).value.trim() : '');
    const nick = v('auNick'), email = v('auEmail'), pass = $('auPass') ? $('auPass').value : '', country = v('auCountry');
    busy = true; msg = ''; drawModal();
    const keep = () => {
      if ($('auNick')) $('auNick').value = nick;
      if ($('auEmail')) $('auEmail').value = email;
      if ($('auCountry')) $('auCountry').value = country;
    };
    keep();
    try {
      if (mode === 'login') {
        await auth.signInWithEmailAndPassword(email, pass);
        // The sign-in event loads the profile too, but not necessarily before we get here
        await loadProfile(auth.currentUser);
      } else if (mode === 'register') {
        checkNick(nick);
        const taken = await db.collection('nicks').doc(nick.toLowerCase()).get();
        if (taken.exists) { const e = new Error(); e.code = 'nick-taken'; throw e; }
        pendingNick = nick;
        await auth.createUserWithEmailAndPassword(email, pass);
        await createProfile(nick, country);
        await sendVerification().catch(() => {});
      } else if (mode === 'verify') {
        busy = false;
        if (await refreshVerified()) { msg = t('vfOk'); msgOk = true; closeModal(); renderAcct(); emit(); const next = afterLogin; afterLogin = null; if (next) next(); }
        else { msg = t('vfNotYet'); msgOk = false; drawModal(); }
        return;
      } else if (mode === 'profile') {
        await db.collection('users').doc(user.uid).update({ country });
        profile.country = country;
        syncLeader();
        busy = false; msg = t('acSaved'); msgOk = true; drawModal(); keep(); renderAcct(); emit();
        return;
      } else {
        checkNick(nick);
        await createProfile(nick, country);
      }
      busy = false;
      if (!profile) { mode = 'nick'; drawModal(); return; }
      renderAcct(); emit();
      // A fresh account (or one never confirmed) goes straight to the e-mail confirmation
      if (!auth.currentUser.emailVerified) {
        mode = 'verify'; msg = ''; drawModal();
        if (!verifySent) sendVerification().catch(() => {});
        return;
      }
      closeModal();
      const next = afterLogin; afterLogin = null;
      if (next && !profile.banned) next();
    } catch (e) {
      busy = false;
      if (e.code === 'verify') { msg = t('acVerify', { e: auth.currentUser.email }); msgOk = true; mode = 'nick'; }
      else { msg = errText(e); msgOk = false; if (auth.currentUser && mode === 'register') mode = 'nick'; }
      drawModal();
      keep();
      if (mode === 'nick' && pendingNick && $('auNick')) $('auNick').value = pendingNick;
    }
  }
  let pendingNick = '';

  // ---------- E-mail confirmation ----------
  let verifySent = false;
  function sendVerification() {
    auth.languageCode = document.documentElement.lang || 'ru'; // the e-mail comes in the site's language
    verifySent = true;
    return auth.currentUser.sendEmailVerification();
  }
  // Accounts made before confirmation existed have never had the e-mail: send it when the dialog first opens
  function openVerify() {
    openModal('verify');
    if (!verifySent && auth.currentUser && !auth.currentUser.emailVerified) {
      sendVerification().catch(e => { msg = errText(e); msgOk = false; drawModal(); });
    }
  }
  // Re-read the account; once confirmed, refresh the sign-in token so the database rules see it too
  async function refreshVerified() {
    const u = auth.currentUser;
    if (!u) return false;
    try { await u.reload(); } catch (e) { return false; }
    if (!auth.currentUser.emailVerified) return false;
    await auth.currentUser.getIdToken(true).catch(() => {});
    user = auth.currentUser;
    return true;
  }

  // ---------- Admin panel ----------
  let users = [], adminQuery = '', flags = {};
  const fmtDate = d => (d && d.toDate ? d.toDate().toLocaleString(document.documentElement.lang === 'en' ? 'en-GB' : 'ru-RU', { dateStyle: 'short', timeStyle: 'short' }) : '—');
  async function openAdmin() {
    if (!admin) return;
    $('chessApp').hidden = true; $('checkersApp').hidden = true; $('adminApp').hidden = false;
    await loadAdmin();
  }
  async function loadAdmin() {
    $('adminStats').innerHTML = `<div class="hint">${t('adLoading')}</div>`;
    try {
      const day = new Date(); day.setHours(0, 0, 0, 0);
      const week = new Date(Date.now() - 7 * 864e5), month = new Date(Date.now() - 30 * 864e5);
      const [us, gs] = await Promise.all([
        db.collection('users').orderBy('createdAt', 'desc').limit(1000).get(),
        db.collection('games').where('createdAt', '>=', month).get()
      ]);
      users = us.docs.map(d => ({ id: d.id, ...d.data() }));
      const games = gs.docs.map(d => d.data()).filter(g => g.createdAt && g.createdAt.toDate);
      const since = d => games.filter(g => g.createdAt.toDate() >= d).length;
      const online = users.filter(u => u.lastSeen && u.lastSeen.toDate && Date.now() - u.lastSeen.toDate() < 864e5).length;
      const tiles = [
        [t('adPlayers'), users.length], [t('adActive'), online], [t('adBannedN'), users.filter(u => u.banned).length],
        [t('adToday'), since(day)], [t('adWeek'), since(week)], [t('adMonth'), games.length],
        [t('gChess'), games.filter(g => g.game === 'chess').length], [t('gCheckers'), games.filter(g => g.game === 'checkers').length]
      ];
      flags = await loadFlags(users);
      tiles.push([t('adSuspect'), Object.entries(flags).filter(([id, f]) => f.why.length && id !== user.uid).length]);
      $('adminStats').innerHTML = tiles.map(([k, v]) => `<div class="tile"><div class="tv">${v}</div><div class="tk">${esc(k)}</div></div>`).join('');
      drawUsers();
      loadLive();
    } catch (e) {
      $('adminStats').innerHTML = `<div class="warn">${esc(errText(e))}</div>`;
    }
  }
  // Signs of engine help, from the saved games: very high accuracy, mostly engine moves, a fast climb
  async function loadFlags(list) {
    let docs = [];
    try { docs = (await db.collectionGroup('history').limit(3000).get()).docs; }
    catch (e) {
      const per = await Promise.all(list.slice(0, 300).map(u => db.collection('users').doc(u.id).collection('history')
        .orderBy('at', 'desc').limit(40).get().then(sn => sn.docs, () => [])));
      docs = per.flat();
    }
    const by = {}, weekAgo = Date.now() - 7 * 864e5;
    for (const d of docs) {
      const uid = d.ref.parent.parent.id, h = d.data(), st = by[uid] || (by[uid] = { acc: [], top: [], week: 0 });
      if (typeof h.acc === 'number') st.acc.push(h.acc);
      if (typeof h.top === 'number') st.top.push(h.top);
      if (typeof h.delta === 'number' && h.at && h.at.toMillis && h.at.toMillis() > weekAgo) st.week += h.delta;
    }
    const avg = a => a.reduce((x, y) => x + y, 0) / a.length, out = {};
    for (const [uid, st] of Object.entries(by)) {
      const why = [];
      if (st.acc.length >= 4 && avg(st.acc) >= 90) why.push(t('chAcc', { n: Math.round(avg(st.acc)) }));
      if (st.top.length >= 4 && avg(st.top) >= 75) why.push(t('chTop', { n: Math.round(avg(st.top)) }));
      if (st.week >= 250) why.push(t('chWeek', { n: st.week }));
      out[uid] = { why, acc: st.acc.length ? Math.round(avg(st.acc)) : null };
    }
    return out;
  }
  function checkCell(u) {
    const f = flags[u.id];
    if (f && f.why.length && u.id !== user.uid) return `<span class="pill bad" title="${esc(f.why.join(', '))}">⚠ ${esc(f.why.join(', '))}</span>`;
    return `<span class="hint">${f && f.acc != null ? esc(t('acc')) + ' ' + f.acc + '%' : '—'}</span>`;
  }
  async function loadLive() {
    const el = $('adminLive');
    el.innerHTML = `<div class="hint">${t('adLoading')}</div>`;
    try {
      const snap = await db.collection('games').where('updatedAt', '>=', new Date(Date.now() - 30 * 60000)).get();
      const live = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(g => g.guest && !g.resigned && !(g.end && g.end.round === (g.round || 0)) && g.updatedAt && g.updatedAt.toMillis)
        .sort((a, b) => b.updatedAt.toMillis() - a.updatedAt.toMillis());
      el.innerHTML = live.length ? '<div class="table-wrap"><table class="users"><tbody>' + live.map(g => `<tr>
          <td>${t(g.game === 'checkers' ? 'gCheckers' : 'gChess')}</td>
          <td class="nick">${badge({ nick: g.hostNick, elo: g.hostElo, country: g.hostCountry, admin: g.hostAdmin })} — ${badge({ nick: g.guestNick, elo: g.guestElo, country: g.guestCountry, admin: g.guestAdmin })}</td>
          <td class="num">${t('adMoves', { n: (g.moves || []).length })}</td><td class="hint">${esc(g.tc || '')}</td>
          <td><button class="b" data-watch="${esc(g.id)}" data-wg="${esc(g.game)}">${t('adWatch')}</button></td></tr>`).join('') + '</tbody></table></div>'
        : `<div class="hint">${t('adNoLive')}</div>`;
    } catch (e) { el.innerHTML = `<div class="warn">${esc(errText(e))}</div>`; }
  }
  function drawUsers() {
    const q = adminQuery.toLowerCase();
    const sus = u => (flags[u.id] && flags[u.id].why.length && u.id !== user.uid ? 1 : 0);
    const rows = users.filter(u => !q || (u.nickLower || '').includes(q)).sort((a, b) => sus(b) - sus(a));
    $('adminUsers').innerHTML = `<thead><tr><th>${t('acNick')}</th><th>${t('adJoined')}</th><th>${t('adSeen')}</th><th>${t('adGames')}</th><th>${t('adElo')}</th><th>${t('adCheck')}</th><th>${t('adStatus')}</th><th></th></tr></thead><tbody>`
      + (rows.length ? rows.map(u => `<tr>
          <td class="nick">${badge({ nick: u.nick, elo: eloOf(u, currentGame()), country: u.country, admin: u.id === user.uid })}</td><td>${fmtDate(u.createdAt)}</td><td>${fmtDate(u.lastSeen)}</td><td class="num">${u.games || 0}</td>
          <td class="num">${eloOf(u, 'chess')} / ${eloOf(u, 'checkers')}</td>
          <td>${checkCell(u)}</td>
          <td>${u.banned ? `<span class="pill bad">${t('adBannedOne')}</span>` : `<span class="pill good">${t('adActiveOne')}</span>`}</td>
          <td>${u.id === user.uid ? `<span class="hint">${t('adYou')}</span>` : `<button class="b${u.banned ? '' : ' danger'}" data-ban="${u.id}" data-to="${!u.banned}">${u.banned ? t('adUnban') : t('adBan')}</button>`}</td>
        </tr>`).join('') : `<tr><td colspan="8" class="hint">${t('adNone')}</td></tr>`) + '</tbody>';
  }
  async function setBan(id, to, btn) {
    btn.disabled = true;
    try {
      await db.collection('users').doc(id).update({ banned: to });
      // A banned player leaves the leaderboard; after an unban the entry comes back on their next visit
      if (to) db.collection('leaders').doc(id).delete().catch(() => {});
      const u = users.find(x => x.id === id); if (u) u.banned = to;
      drawUsers();
    } catch (e) { btn.disabled = false; btn.textContent = errText(e); }
  }

  // ---------- Wiring ----------
  function init() {
    renderAcct();
    if (!available) return;
    window.firebase.initializeApp(cfg);
    auth = window.firebase.auth();
    db = window.firebase.firestore();
    // Networks that break streaming connections (some VPNs, antivirus, office proxies) stall live
    // updates; let the SDK detect that and fall back to long polling
    db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
    // Local testing against the Firebase emulators: http://localhost:<port>/?emu
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('emu')) {
      auth.useEmulator('http://127.0.0.1:9099');
      db.useEmulator('127.0.0.1', 8085);
    }
    auth.onAuthStateChanged(async u => {
      // Coming back from the link in the e-mail: pick up the new status
      if (u && !u.emailVerified) await refreshVerified();
      user = auth.currentUser || u;
      if (u) await loadProfile(u); else { profile = null; admin = false; }
      histList = null;
      if (u && profile) syncLeader();
      ready = true;
      renderAcct(); emit();
      while (readyWaiters.length) readyWaiters.shift()();
      if (u && !profile && $('authModal').hidden) openModal('nick');
    });
    $('acct').addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'login') openModal('login');
      else if (a === 'finish') openModal('nick');
      else if (a === 'profile') { openModal('profile'); loadHistory(); }
      else if (a === 'verify') openVerify();
      else if (a === 'logout') { auth.signOut(); $('adminApp').hidden = true; window.gambitSetGame && window.gambitSetGame(); }
      else if (a === 'admin') openAdmin();
    });
    $('authModal').addEventListener('click', e => {
      if (e.target === $('authModal')) { closeModal(); return; }
      const m = e.target.closest('[data-m]');
      if (m) { mode = m.dataset.m; msg = ''; drawModal(); return; }
      const hr = e.target.closest('[data-h]');
      if (hr && Array.isArray(histList)) { const h = histList[+hr.dataset.h]; closeModal(); if (h && window.gambitOpenRecord) window.gambitOpenRecord(h); return; }
      const b = e.target.closest('[data-a]'); if (!b) return;
      if (b.dataset.a === 'close') closeModal();
      else if (b.dataset.a === 'resend') {
        sendVerification().then(() => { msg = t('vfSent'); msgOk = true; drawModal(); }, err => { msg = errText(err); msgOk = false; drawModal(); });
      }
      else if (b.dataset.a === 'reset') {
        const email = $('auEmail').value.trim();
        if (!email) { msg = t('aeEmailBad'); msgOk = false; drawModal(); return; }
        auth.sendPasswordResetEmail(email).then(() => { msg = t('acResetSent'); msgOk = true; drawModal(); }, err => { msg = errText(err); msgOk = false; drawModal(); });
      }
    });
    $('authModal').addEventListener('submit', e => { e.preventDefault(); if (!busy) submit(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('authModal').hidden) closeModal(); });
    $('adminBack').addEventListener('click', () => { $('adminApp').hidden = true; window.gambitSetGame && window.gambitSetGame(); });
    $('adminRefresh').addEventListener('click', loadAdmin);
    $('adminSearch').addEventListener('input', e => { adminQuery = e.target.value.trim(); drawUsers(); });
    $('adminUsers').addEventListener('click', e => { const b = e.target.closest('[data-ban]'); if (b) setBan(b.dataset.ban, b.dataset.to === 'true', b); });
    $('adminLive').addEventListener('click', e => { const b = e.target.closest('[data-watch]'); if (b) window.gambitNet.spectate(b.dataset.wg, b.dataset.watch); });
    document.addEventListener('gambit-game', renderAcct);
    // "Last seen" on the leaderboard entry, for friends lists
    setInterval(() => { if (document.visibilityState === 'visible') syncLeader(); }, 180000);
    // Returning to the tab after clicking the link: notice the confirmation without a reload
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && user && !user.emailVerified && await refreshVerified()) { renderAcct(); emit(); }
    });
    document.addEventListener('gambit-lang', () => { renderAcct(); if (!$('authModal').hidden) drawModal(); if (!$('adminApp').hidden) loadAdmin(); });
  }

  return {
    available, init, errText,
    db: () => db,
    onReady: f => (ready ? f() : readyWaiters.push(f)),
    onChange: f => changeListeners.push(f),
    user: () => user, profile: () => profile,
    elo: game => eloOf(profile, game), country: () => (profile && profile.country) || '', isAdmin: () => admin,
    // Re-read the profile (the rating may have changed in another tab) before it goes into a game
    refresh: async () => { if (user) { await loadProfile(user); renderAcct(); } },
    badge, rate, record, recordAcc,
    // What a win, a draw and a loss would do to the rating right now
    preview: (game, oppElo, floor, boost) => (user && profile && !profile.banned
      ? { w: eloDelta(game, oppElo, 1, floor, boost), d: eloDelta(game, oppElo, 0.5, floor, boost), l: eloDelta(game, oppElo, 0, floor, boost) }
      : null),
    canPlay: () => !!(user && profile && !profile.banned && user.emailVerified),
    verified: () => !!(user && user.emailVerified),
    banned: () => !!(profile && profile.banned),
    // Ask the player to sign in, then carry on with what they were doing
    prompt: next => {
      afterLogin = next || null;
      if (user && profile && !user.emailVerified) openVerify(); else openModal(!user ? 'login' : !profile ? 'nick' : 'login');
    },
    promptVerify: () => openVerify(),
    ts
  };
})();
</script>

<script>
// ---------- Online play: one Firestore document per game ----------
// The document holds the whole game (round, moves, resignation); both players listen to it live.
// The Firestore rules let only signed-in, unbanned players create, join and move.
window.gambitNet = (() => {
  'use strict';
  const t = (k, v) => window.gambitI18n.t(k, v);
  const A = window.gambitAuth;
  const available = !!(A && A.available);
  const hooks = {};
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clean = raw => String(raw || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);

  function makeCode() {
    const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }

  function create(game, box, cb) {
    let state = 'idle', code = '', myColor = null, opp = null, err = '', copied = false, unsub = null, ref = null;
    let pushing = false, pushAgain = false, pushTries = 0, sending = false, watchTimer = null, matchedGame = false;
    // Colours swap every round (rematch), so the host's colour of round 0 is kept and flipped as needed
    let baseColor = null, amHostNow = false, players = null, spectating = false, invited = '';
    let drawOffer = null, rematch = null, chat = [], chatSeen = 0, chatInit = false, lastSaid = 0;
    // Clocks: ms left for each side as of `since` (local time), for the move count `lastLen`
    let tc = null, clk = null, since = 0, lastLen = 0, lastRound = -1, clockTimer = null, flagSent = -1, overAt = 0;
    const swap = c => (c === 'w' ? 'b' : 'w');
    const curColor = () => (baseColor && cb.round() % 2 ? swap(baseColor) : baseColor);
    const TCS = ['', '1+0', '3+0', '3+2', '5+0', '10+0'];
    let tcPick = '';
    try { tcPick = localStorage.getItem('gambit-tc') || ''; } catch (e) {}
    if (!TCS.includes(tcPick)) tcPick = '';
    const parseTc = v => { const m = /^(\d+)\+(\d+)$/.exec(v || ''); return m ? { base: +m[1] * 60000, inc: +m[2] * 1000 } : null; };
    const tcName = v => { const [m, i] = v.split('+'); return +i ? `${m}+${i}` : t('tcMin', { m }); };
    const newClock = () => (parseTc(tcPick) ? { w: parseTc(tcPick).base, b: parseTc(tcPick).base } : null);
    function resetExtras() {
      clearInterval(clockTimer); clockTimer = null;
      tc = null; clk = null; lastLen = 0; lastRound = -1; flagSent = -1; overAt = 0;
      baseColor = null; players = null; drawOffer = null; rematch = null; chat = []; chatSeen = 0; chatInit = false; invited = '';
    }
    const roomKey = 'gambit-room-' + game;
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function stop() { if (unsub) unsub(); unsub = null; clearTimeout(watchTimer); }
    function setState(s) { state = s; draw(); cb.change(); }
    function forget() { try { sessionStorage.removeItem(roomKey); } catch (e) {} }
    function remember() { try { sessionStorage.setItem(roomKey, code); } catch (e) {} }
    function fail(message) { err = message; stop(); forget(); setState('error'); }

    // Count the game once per player, even if the page is reloaded mid-game
    function countGame() {
      const key = 'gambit-counted-' + code;
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) {}
      A.db().collection('users').doc(A.user().uid)
        .update({ games: window.firebase.firestore.FieldValue.increment(1), lastSeen: A.ts() }).catch(() => {});
    }

    function watch() {
      stop();
      // includeMetadataChanges tells us when our own move has reached the server
      unsub = ref.onSnapshot({ includeMetadataChanges: true }, snap => {
        if (!snap.exists) { fail(t('onNoGame', { c: code })); return; }
        const wasSending = sending;
        sending = snap.metadata.hasPendingWrites;
        if (wasSending !== sending && state === 'connected') draw();
        const g = snap.data(), me = A.user() && A.user().uid;
        const amHost = g.host === me;
        players = {
          host: { nick: g.hostNick, elo: g.hostElo, country: g.hostCountry, admin: !!g.hostAdmin },
          guest: g.guest ? { nick: g.guestNick, elo: g.guestElo, country: g.guestCountry, admin: !!g.guestAdmin } : null,
          hostColor: g.hostColor
        };
        tc = parseTc(g.tc);
        players.tc = g.tc || '';
        if (spectating) {
          if (!g.guest) return;
          if (state !== 'watching') { setState('watching'); cb.start(null); }
          cb.applyState({ round: g.round || 0, moves: Array.isArray(g.moves) ? g.moves : [], resigned: g.resigned || null });
          afterSnapshot(g);
          return;
        }
        if (!g.guest) { if (amHost && state !== 'waiting') setState('waiting'); return; }
        amHostNow = amHost;
        baseColor = amHost ? g.hostColor : swap(g.hostColor);
        myColor = curColor();
        opp = amHost
          ? { nick: g.guestNick, elo: g.guestElo, country: g.guestCountry, admin: !!g.guestAdmin }
          : { nick: g.hostNick, elo: g.hostElo, country: g.hostCountry, admin: !!g.hostAdmin };
        if (state !== 'connected') { invited = ''; setState('connected'); cb.start(myColor); countGame(); }
        const server = { round: g.round || 0, moves: Array.isArray(g.moves) ? g.moves : [], resigned: g.resigned || null };
        cb.applyState(server);
        afterSnapshot(g);
        // Self-healing: the server copy is behind ours (a write was lost), so send our game again
        if (!snap.metadata.hasPendingWrites && !snap.metadata.fromCache && !pushing) {
          const mine = cb.getState();
          if (mine.round > server.round || (mine.round === server.round && mine.moves.length > server.moves.length)
              || (mine.resigned && !server.resigned)) push();
        }
      }, e => {
        // A dropped connection must not end the game: listen again in a moment
        if (e.code === 'permission-denied' || e.code === 'not-found') { fail(A.errText(e)); return; }
        unsub = null;
        watchTimer = setTimeout(() => { if (ref && (state === 'connected' || state === 'waiting')) watch(); }, 2000);
      });
    }

    // Clocks, draw offers, the rematch and chat, after the moves are in
    function afterSnapshot(g) {
      drawOffer = g.drawOffer || null;
      rematch = g.rematch || null;
      syncClock(g);
      syncChat(g.chat);
      // The game ended off the board: an agreed draw or a fallen flag
      if (g.end && g.end.round === cb.round() && !cb.over()) cb.external(g.end.key, g.end.loser || null);
      // Both want a rematch: the host starts it
      if (!spectating && amHostNow && rematch && rematch.round === cb.round() && rematch.w && rematch.b && cb.over()) cb.newRound();
      draw();
    }

    // ---------- Clocks ----------
    // Each side's clock runs from its second move on; the mover writes the time left with the move
    function syncClock(g) {
      if (!tc) { clk = null; return; }
      const len = Array.isArray(g.moves) ? g.moves.length : 0, r = g.round || 0;
      if (r !== lastRound || !clk) { lastRound = r; lastLen = 0; clk = { w: tc.base, b: tc.base }; since = Date.now(); flagSent = -1; overAt = 0; }
      if (len !== lastLen) {
        if (g.clk && typeof g.clk.w === 'number' && typeof g.clk.b === 'number') clk = { w: g.clk.w, b: g.clk.b };
        lastLen = len; since = Date.now();
      }
      if (!clockTimer) clockTimer = setInterval(tickClock, 200);
    }
    function clockForPush(st) {
      if (!tc) return {};
      if (st.round !== lastRound || !clk) { lastRound = st.round; lastLen = 0; clk = { w: tc.base, b: tc.base }; since = Date.now(); flagSent = -1; overAt = 0; }
      const len = st.moves.length, me = curColor();
      if (len > lastLen) {
        const mover = (len - 1) % 2 ? 'b' : 'w';
        if (mover === me && len - 1 >= 2) clk[me] = Math.max(0, clk[me] - (Date.now() - since)) + tc.inc;
        lastLen = len; since = Date.now();
      }
      return { clk: { w: Math.round(clk.w), b: Math.round(clk.b) } };
    }
    function clockState() {
      if (!tc || !clk) return null;
      const turn = lastLen % 2 ? 'b' : 'w', over = cb.over();
      // Once the game is over the clocks stop where they were; a fallen flag shows zero
      if (over && !overAt) overAt = Date.now();
      if (!over) overAt = 0;
      const ticking = lastLen >= 2 && (state === 'connected' || state === 'watching');
      const now = over ? overAt : Date.now();
      return { turn, running: ticking && !over, left: c => clk[c] - (ticking && c === turn ? now - since : 0) };
    }
    const fmtClock = ms => {
      ms = Math.max(0, ms);
      if (ms < 10000) return (Math.floor(ms / 100) / 10).toFixed(1);
      const sec = Math.ceil(ms / 1000);
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    };
    function paintClocks(cs) {
      for (const el of box.querySelectorAll('[data-clk]')) {
        const c = el.dataset.clk, l = cs.left(c);
        el.querySelector('b').textContent = fmtClock(l);
        el.classList.toggle('run', cs.running && cs.turn === c);
        el.classList.toggle('low', l < 20000);
      }
    }
    function tickClock() {
      if (!tc || !(state === 'connected' || state === 'watching')) { clearInterval(clockTimer); clockTimer = null; return; }
      const cs = clockState();
      if (!cs) return;
      paintClocks(cs);
      if (!cs.running || spectating || flagSent === cb.round()) return;
      // Our own flag falls at zero; the opponent's gets two seconds of grace for network delay
      const l = cs.left(cs.turn);
      if ((cs.turn === curColor() && l <= 0) || (cs.turn !== curColor() && l <= -2000)) {
        flagSent = cb.round();
        ref.update({ end: { round: cb.round(), key: 'time', loser: cs.turn }, updatedAt: A.ts() }).catch(() => { flagSent = -1; });
      }
    }
    function clocksHTML() {
      const cs = clockState();
      if (!cs) return '';
      const hostNow = players && (cb.round() % 2 ? swap(players.hostColor) : players.hostColor);
      const nickOfColor = c => (players ? (c === hostNow ? players.host : players.guest || {}).nick || '' : '');
      const bottom = spectating ? 'w' : curColor(), top = swap(bottom);
      const row = c => `<div class="clk" data-clk="${c}"><span>${t(c === 'w' ? 'colW' : 'colB')} · ${!spectating && c === bottom ? t('onYou') : esc(nickOfColor(c))}</span><b>${fmtClock(cs.left(c))}</b></div>`;
      return `<div class="clocks">${row(top)}${row(bottom)}</div>`;
    }

    // ---------- Quick chat ----------
    const nickOf = from => (players ? ((from === 'h' ? players.host : players.guest) || {}).nick || '?' : '?');
    function syncChat(list) {
      chat = Array.isArray(list) ? list : [];
      if (!chatInit) { chatInit = true; chatSeen = chat.length; return; }
      if (chat.length > chatSeen) {
        const mine = spectating ? null : amHostNow ? 'h' : 'g';
        for (const c of chat.slice(chatSeen).filter(x => x.from !== mine).slice(-2)) {
          if (window.gambitFx) { window.gambitFx.sound('notify'); window.gambitFx.toast(`<div><b>${esc(nickOf(c.from))}:</b> ${esc(t('chatPhrases')[c.p] || '')}</div>`, 3500); }
        }
        chatSeen = chat.length;
      }
    }
    function chatHTML(readonly) {
      const P = t('chatPhrases'), mine = spectating ? null : amHostNow ? 'h' : 'g';
      const lines = chat.slice(-4).map(c => `<div class="cm"><b>${esc(c.from === mine ? t('onYou') : nickOf(c.from))}:</b> ${esc(P[c.p] || '')}</div>`).join('');
      return (lines ? `<div class="chat">${lines}</div>` : '')
        + (readonly ? '' : `<div class="phrases">${P.map((x, i) => `<button class="b" data-act="say" data-p="${i}">${esc(x)}</button>`).join('')}</div>`);
    }
    function say(i) {
      if (state !== 'connected' || Date.now() - lastSaid < 1500) return;
      lastSaid = Date.now();
      ref.update({ chat: window.firebase.firestore.FieldValue.arrayUnion({ from: amHostNow ? 'h' : 'g', p: i, at: Date.now() }) })
        .catch(e => { err = A.errText(e); draw(); });
    }

    // ---------- Draw offer and rematch ----------
    function offerDraw() {
      ref.update({ drawOffer: { round: cb.round(), by: curColor() }, updatedAt: A.ts() }).catch(e => { err = A.errText(e); draw(); });
    }
    function answerDraw(yes) {
      const upd = yes ? { end: { round: cb.round(), key: 'draw', loser: null }, drawOffer: null, updatedAt: A.ts() } : { drawOffer: null, updatedAt: A.ts() };
      ref.update(upd).catch(e => { err = A.errText(e); draw(); });
    }
    async function askRematch() {
      if (state !== 'connected' || !cb.over()) return;
      const r = cb.round(), me = curColor(), target = ref;
      try {
        await A.db().runTransaction(async tx => {
          const cur = (await tx.get(target)).data().rematch;
          const next = cur && cur.round === r ? { ...cur, [me]: true } : { round: r, w: me === 'w', b: me === 'b' };
          tx.update(target, { rematch: next, updatedAt: A.ts() });
        });
      } catch (e) { err = A.errText(e); draw(); }
    }

    // ---------- Friends and watching ----------
    async function invite(fid, fnick) {
      await host(cb.side());
      if (!ref || !code || state === 'error' || state === 'idle') return;
      invited = fnick; draw();
      try {
        await A.db().collection('invites').doc(A.user().uid + '_' + fid)
          .set({ from: A.user().uid, fromNick: A.profile().nick, to: fid, game, code, at: A.ts() });
      } catch (e) { invited = ''; err = A.errText(e); draw(); }
    }
    function spectate(c) {
      leave();
      code = c; spectating = true; err = '';
      ref = A.db().collection('games').doc(code);
      setState('connecting');
      watch();
    }

    async function host(side) {
      if (!A.canPlay()) { A.prompt(() => host(side)); return; }
      matchedGame = false;
      resetExtras();
      setState('opening');
      await A.refresh();
      const db = A.db(), me = A.user().uid, nick = A.profile().nick;
      for (let i = 0; i < 4; i++) {
        code = makeCode();
        ref = db.collection('games').doc(code);
        try {
          await ref.set({
            game, host: me, hostNick: nick, hostColor: side === 'b' ? 'b' : 'w', guest: null, guestNick: null,
            hostElo: A.elo(game), hostCountry: A.country(), hostAdmin: A.isAdmin(),
            round: 0, moves: [], resigned: null, createdAt: A.ts(), updatedAt: A.ts(), tc: tcPick || null, clk: newClock()
          });
          copied = false; remember(); watch();
          return;
        } catch (e) {
          // A taken code looks like "permission denied": try another one
          if (e.code !== 'permission-denied' || i === 3) { fail(A.errText(e)); return; }
        }
      }
    }

    async function join(raw) {
      const c1 = clean(raw);
      if (!c1) return;
      if (!A.canPlay()) { A.prompt(() => join(c1)); return; }
      resetExtras();
      code = c1; setState('connecting');
      await A.refresh();
      ref = A.db().collection('games').doc(code);
      try {
        const snap = await ref.get();
        if (!snap.exists) { fail(t('onNoGame', { c: code })); return; }
        const g = snap.data(), me = A.user().uid;
        if (g.game !== game) { fail(t('onWrongGame')); return; }
        if (g.host !== me && g.guest && g.guest !== me) { fail(t('onFull')); return; }
        if (g.host !== me && !g.guest) await ref.update({ guest: me, guestNick: A.profile().nick, guestElo: A.elo(game), guestCountry: A.country(), guestAdmin: A.isAdmin(), updatedAt: A.ts() });
        remember(); watch();
      } catch (e) { fail(A.errText(e)); }
    }

    // ---------- Matchmaking ----------
    // Each player puts a ticket in the queue. Of two compatible players, the one with the smaller id
    // opens the game and hands its code to the other in one transaction, so nobody is paired twice.
    let mm = null; // { start, ticks, timer, unsub, scanning }
    const STALE = 120000;
    // Rating window: ±100 at first, 20 points wider every second of waiting, up to ±1000
    const rangeFor = secs => Math.min(1000, 100 + Math.round(secs * 20));
    function stopSearch(keepTicket) {
      if (!mm) return;
      clearInterval(mm.timer);
      if (mm.unsub) mm.unsub();
      if (!keepTicket && A.user()) A.db().collection('queue').doc(A.user().uid).delete().catch(() => {});
      mm = null;
    }
    async function findMatch() {
      if (!A.canPlay()) { A.prompt(() => findMatch()); return; }
      stop(); forget(); err = ''; matchedGame = false;
      setState('searching');
      await A.refresh();
      const db = A.db(), me = A.user().uid, qref = db.collection('queue').doc(me);
      try {
        await qref.delete().catch(() => {});
        await qref.set({ game, elo: A.elo(game), nick: A.profile().nick, country: A.country(), admin: A.isAdmin(), createdAt: A.ts(), matched: null, tc: tcPick });
      } catch (e) { fail(A.errText(e)); return; }
      if (state !== 'searching') { qref.delete().catch(() => {}); return; }
      mm = { start: Date.now(), ticks: 0, scanning: false };
      // Someone else may open the game for us: their code arrives on our ticket
      mm.unsub = qref.onSnapshot(snap => {
        const d = snap.data();
        if (d && d.matched && state === 'searching') { const c = d.matched; stopSearch(false); join(c); }
      }, () => {});
      mm.timer = setInterval(() => {
        if (!mm || state !== 'searching') return;
        mm.ticks++;
        draw();
        if (mm.ticks % 3 === 0) scan();
      }, 1000);
      scan();
    }
    async function scan() {
      if (!mm || mm.scanning || state !== 'searching') return;
      mm.scanning = true;
      try {
        const db = A.db(), me = A.user().uid, myElo = A.elo(game), now = Date.now();
        const snap = await db.collection('queue').where('game', '==', game).where('matched', '==', null).get();
        const waited = (now - mm.start) / 1000;
        const cands = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .filter(c => c.id !== me && me < c.id && c.createdAt && now - c.createdAt.toMillis() < STALE && (c.tc || '') === tcPick)
          .filter(c => Math.abs(c.elo - myElo) <= rangeFor(Math.max(waited, (now - c.createdAt.toMillis()) / 1000)))
          .sort((a, b) => Math.abs(a.elo - myElo) - Math.abs(b.elo - myElo));
        for (const c of cands) {
          if (!mm || state !== 'searching') break;
          if (await claim(c.id)) return;
        }
      } catch (e) {
      } finally {
        if (mm) mm.scanning = false;
      }
    }
    async function claim(otherId) {
      const db = A.db(), me = A.user().uid;
      const myQ = db.collection('queue').doc(me), theirQ = db.collection('queue').doc(otherId);
      const newCode = makeCode(), gref = db.collection('games').doc(newCode);
      const side = Math.random() < 0.5 ? 'w' : 'b';
      try {
        await db.runTransaction(async tx => {
          const mine = await tx.get(myQ), theirs = await tx.get(theirQ);
          if (!mine.exists || mine.data().matched || !theirs.exists || theirs.data().matched) throw new Error('taken');
          tx.set(gref, {
            game, host: me, hostNick: A.profile().nick, hostColor: side, guest: null, guestNick: null,
            hostElo: A.elo(game), hostCountry: A.country(), hostAdmin: A.isAdmin(),
            round: 0, moves: [], resigned: null, createdAt: A.ts(), updatedAt: A.ts(), tc: tcPick || null, clk: newClock()
          });
          tx.update(theirQ, { matched: newCode });
          tx.delete(myQ);
        });
      } catch (e) {
        return false;
      }
      stopSearch(true); // our ticket went away in the transaction
      resetExtras();
      code = newCode; ref = gref; copied = false; matchedGame = true;
      remember(); setState('waiting'); watch();
      // The other player closed the page before joining: go back to the queue
      setTimeout(() => {
        if (state === 'waiting' && ref === gref && matchedGame) { stop(); forget(); findMatch(); }
      }, 20000);
      return true;
    }

    function leave() { stopSearch(false); matchedGame = false; stop(); if (!spectating) forget(); spectating = false; resetExtras(); myColor = null; pushAgain = false; setState('idle'); }

    // Send the whole game; on a failure try again with a growing pause, and send the newest
    // state if more moves were made meanwhile
    async function push() {
      if (state !== 'connected' || !ref) return;
      if (pushing) { pushAgain = true; return; }
      pushing = true;
      const target = ref;
      try {
        const st = cb.getState();
        await target.update({ ...st, ...clockForPush(st), updatedAt: A.ts() });
        pushTries = 0;
        if (err) { err = ''; draw(); }
      } catch (e) {
        if (e.code === 'permission-denied') { err = A.errText(e); draw(); }
        else if (pushTries < 8) { pushTries++; pushAgain = true; await sleep(Math.min(8000, 400 * 2 ** pushTries)); }
        else { err = A.errText(e); draw(); }
      }
      pushing = false;
      if (pushAgain && target === ref) { pushAgain = false; push(); }
    }

    function draw() {
      const link = location.origin + location.pathname + '?game=' + game + '&join=' + code;
      const joinForm = `<div class="muted">${t('onOr')}</div>
        <form class="row" data-act="join"><input id="${game}-code" maxlength="5" autocomplete="off" placeholder="${t('onCodePh')}" aria-label="${t('onCodePh')}"><button class="b">${t('onJoin')}</button></form>`;
      let h = '';
      if (!A.user() || !A.profile()) {
        h = `<div class="muted">${t('onNeedLogin')}</div><div class="row"><button class="b primary" data-act="login">${t('acLogin')}</button></div>`;
      } else if (A.banned()) {
        h = `<div class="warn">${t('onBanned')}</div>`;
      } else if (!A.verified()) {
        h = `<div class="muted">${t('onVerify')}</div><div class="row"><button class="b primary" data-act="verify">${t('vfBtn')}</button></div>`;
      } else if (state === 'idle' || state === 'error') {
        if (state === 'error') h += `<div class="warn">${esc(t('onError', { e: err }))}</div>`;
        h += `<label class="field" for="${game}-tc">${t('tcLabel')}<select id="${game}-tc" data-tc>`
          + TCS.map(v => `<option value="${v}"${v === tcPick ? ' selected' : ''}>${v ? tcName(v) : t('tcNone')}</option>`).join('') + `</select></label>
          <div class="row"><button class="b primary" data-act="find">${t('onFind')}</button></div>
          <div class="muted">${t('onFindHint')}</div>
          <div class="row"><button class="b" data-act="host">${t('onCreate')}</button></div>` + joinForm;
      } else if (state === 'searching') {
        const secs = mm ? Math.floor((Date.now() - mm.start) / 1000) : 0;
        const clock = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
        h += `<div class="ok">${t('onSearching')} <span class="clock">${clock}</span></div>
          <div class="muted">${t('onRange', { r: rangeFor(secs) })}</div>
          <div class="row"><button class="b" data-act="leave">${t('cancel')}</button></div>`;
      } else if (state === 'waiting' && matchedGame) {
        h += `<div class="ok">${t('onFound')}</div><div class="muted">${t('onFoundWait')}</div>
          <div class="row"><button class="b" data-act="leave">${t('cancel')}</button></div>`;
      } else if (state === 'opening' || state === 'connecting') {
        h += `<div class="muted">${state === 'opening' ? t('onOpening') : esc(t('onConnecting', { c: code }))}</div>
          <div class="row"><button class="b" data-act="leave">${t('cancel')}</button></div>`;
      } else if (state === 'waiting') {
        h += `<div class="muted">${t('onCode')}</div><div class="code">${esc(code)}</div>
          <div class="link">${esc(link)}</div>
          <div class="row"><button class="b primary" data-act="copy" data-link="${esc(link)}">${copied ? t('onCopied') : t('onCopy')}</button>
          <button class="b" data-act="leave">${t('cancel')}</button></div>
          <div class="muted">${invited ? esc(t('invSent', { n: invited })) : t('onWaiting')}</div>`;
      } else if (state === 'connected') {
        const r = cb.round(), me = curColor(), over = cb.over();
        const theyOffer = drawOffer && drawOffer.round === r && drawOffer.by !== me && !over;
        const iOffer = drawOffer && drawOffer.round === r && drawOffer.by === me && !over;
        const rmMine = !!(rematch && rematch.round === r && rematch[me]), rmTheirs = !!(rematch && rematch.round === r && rematch[swap(me)]);
        h += `<div class="ok">${t('onVs')} ${opp ? A.badge(opp) : '?'}</div>
          <div class="muted">${t('onConnected', { c: t(me === 'w' ? 'white' : 'black').toLowerCase() })}${tc && players && players.tc ? ' · ⏱ ' + tcName(players.tc) : ''}</div>
          ${clocksHTML()}
          ${theyOffer ? `<div class="offer">${t('drOffered')}<div class="row"><button class="b primary" data-act="drawYes">${t('drAccept')}</button><button class="b" data-act="drawNo">${t('drDecline')}</button></div></div>` : ''}
          ${over && rmTheirs && !rmMine ? `<div class="offer">${t('rmOffered')}<div class="row"><button class="b primary" data-act="rematch">${t('rmAccept')}</button></div></div>` : ''}
          ${sending ? `<div class="muted">${t('onSending')}</div>` : ''}
          ${err ? `<div class="warn">${esc(err)}</div>` : ''}
          <div class="row">${!over ? `<button class="b" data-act="draw"${iOffer ? ' disabled' : ''}>${t(iOffer ? 'drSent' : 'drOffer')}</button>` : ''}${over && !(rmTheirs && !rmMine) ? `<button class="b primary" data-act="rematch"${rmMine ? ' disabled' : ''}>${t(rmMine ? 'rmSent' : 'rmBtn')}</button>` : ''}<button class="b" data-act="leave">${t('onLeave')}</button></div>
          ${chatHTML(false)}`;
      } else if (state === 'watching') {
        const hostNow = players && (cb.round() % 2 ? swap(players.hostColor) : players.hostColor);
        const pw = players && (hostNow === 'w' ? players.host : players.guest), pb = players && (hostNow === 'w' ? players.guest : players.host);
        h += `<div class="ok">${t('spWatching')}</div>
          ${pw && pb ? `<div class="muted">${t('colW')}: ${A.badge(pw)}</div><div class="muted">${t('colB')}: ${A.badge(pb)}</div>` : ''}
          ${clocksHTML()}${chatHTML(true)}
          <div class="row"><button class="b" data-act="leave">${t('spStop')}</button></div>`;
      }
      box.innerHTML = h;
    }

    box.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b || b.tagName === 'FORM') return;
      const act = b.dataset.act;
      if (act === 'host') host(cb.side());
      else if (act === 'find') findMatch();
      else if (act === 'verify') A.promptVerify();
      else if (act === 'leave') leave();
      else if (act === 'draw') offerDraw();
      else if (act === 'drawYes') answerDraw(true);
      else if (act === 'drawNo') answerDraw(false);
      else if (act === 'rematch') { b.disabled = true; askRematch(); }
      else if (act === 'say') say(+b.dataset.p);
      else if (act === 'login') A.prompt();
      else if (act === 'copy') {
        const done = () => { copied = true; draw(); };
        try { navigator.clipboard.writeText(b.dataset.link).then(done, () => {}); } catch (e2) {}
      }
    });
    box.addEventListener('change', e => {
      if (!e.target.matches('[data-tc]')) return;
      tcPick = TCS.includes(e.target.value) ? e.target.value : '';
      try { localStorage.setItem('gambit-tc', tcPick); } catch (e2) {}
    });
    box.addEventListener('submit', e => {
      e.preventDefault();
      join(box.querySelector('input').value);
    });
    document.addEventListener('gambit-lang', draw);
    window.addEventListener('pagehide', () => { if (mm) stopSearch(false); });
    if (A) A.onChange(() => { if (A.banned() && state !== 'idle') leave(); else draw(); });
    draw();

    const session = {
      join, leave, draw, push, invite, spectate,
      color: () => (state === 'connected' ? curColor() : null),
      opp: () => (opp ? { ...opp } : null),
      spectating: () => state === 'watching',
      oppElo: () => (opp && typeof opp.elo === 'number' ? opp.elo : 1000),
      active: () => state === 'connected',
      waiting: () => state === 'waiting' || state === 'searching',
      saved: () => { try { return sessionStorage.getItem(roomKey) || ''; } catch (e) { return ''; } }
    };
    hooks[game] = { session, enter: cb.enter };
    return session;
  }

  // After sign-in is known: open a shared link (?game=chess&join=CODE), or return to the game
  // this tab was playing before a reload
  function autoJoin(linkGame, linkCode) {
    if (!available) return;
    A.onReady(() => {
      if (linkCode && hooks[linkGame]) {
        hooks[linkGame].enter(true);
        hooks[linkGame].session.join(linkCode);
        return;
      }
      for (const g of Object.keys(hooks)) {
        const saved = hooks[g].session.saved();
        if (saved && A.canPlay()) { hooks[g].enter(false); hooks[g].session.join(saved); }
      }
    });
  }

  // From the friends list, an invitation or the admin panel: switch to that game and act there
  function joinGame(game, code) { const h = hooks[game]; if (!h) return; h.session.leave(); h.enter(true); h.session.join(code); }
  function invite(game, fid, fnick) { const h = hooks[game]; if (!h) return; h.session.leave(); h.enter(true); h.session.invite(fid, fnick); }
  function spectate(game, code) { const h = hooks[game]; if (!h) return; h.enter(true); h.session.spectate(code); }

  return { available, create, autoJoin, joinGame, invite, spectate };
})();
</script>

<script>
// ---------- Sounds, sliding pieces, toasts and confetti ----------
window.gambitFx = (() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const reduced = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let soundOn = true;
  try { soundOn = localStorage.getItem('gambit-sound') !== '0'; } catch (e) {}

  // Sounds are synthesised, so the page needs no audio files
  let ctx = null;
  function audio() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function tone(freq, dur, type, vol, delay = 0) {
    const c = audio(); if (!c) return;
    const t0 = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  // A wooden knock: a short burst of filtered noise
  function knock(vol, dur, freq, delay = 0) {
    const c = audio(); if (!c) return;
    const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2; g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(c.currentTime + delay);
  }
  const SOUNDS = {
    move: () => knock(0.9, 0.08, 1500),
    capture: () => { knock(1, 0.1, 900); knock(0.6, 0.07, 2200, 0.04); },
    check: () => { tone(880, 0.14, 'triangle', 0.12); tone(1175, 0.18, 'triangle', 0.1, 0.1); },
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.32, 'sine', 0.12, i * 0.11)),
    lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.36, 'sine', 0.1, i * 0.14)),
    end: () => [523, 659].forEach((f, i) => tone(f, 0.3, 'sine', 0.1, i * 0.12)),
    notify: () => { tone(988, 0.12, 'sine', 0.1); tone(1319, 0.16, 'sine', 0.08, 0.09); },
    wrong: () => tone(196, 0.22, 'square', 0.05)
  };
  function sound(name) { if (!soundOn || !SOUNDS[name]) return; try { SOUNDS[name](); } catch (e) {} }

  // The moved piece glides from its old square to the new one
  function slide(board, from, to) {
    if (reduced() || from === to) return;
    const a = board.querySelector(`[data-i="${from}"]`), b = board.querySelector(`[data-i="${to}"]`);
    const pc = b && b.querySelector('svg');
    if (!a || !pc || !pc.animate) return;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    b.style.overflow = 'visible'; b.style.zIndex = 4;
    const an = pc.animate([{ transform: `translate(${ra.left - rb.left}px, ${ra.top - rb.top}px)` }, { transform: 'translate(0, 0)' }],
      { duration: 170, easing: 'ease-out' });
    const done = () => { b.style.overflow = ''; b.style.zIndex = ''; };
    an.onfinish = done; an.oncancel = done;
  }

  function toast(html, ms = 5000) {
    const el = document.createElement('div');
    el.className = 'toast'; el.innerHTML = html;
    $('toasts').appendChild(el);
    const close = () => el.remove();
    if (ms) setTimeout(close, ms);
    return { el, close };
  }

  function confetti(big) {
    if (reduced()) return;
    const cv = document.createElement('canvas'), dpr = window.devicePixelRatio || 1;
    cv.className = 'confetti';
    document.body.appendChild(cv);
    const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr, g = cv.getContext('2d');
    const colors = ['#f0a742', '#1d9e98', '#d23d36', '#4f9a35', '#6a83a3', '#ff5ccf'];
    const parts = Array.from({ length: big ? 220 : 120 }, () => ({
      x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.7,
      vx: (Math.random() - 0.5) * W * 0.02, vy: -(0.6 + Math.random()) * H * 0.028,
      s: (5 + Math.random() * 6) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
      c: colors[Math.floor(Math.random() * colors.length)]
    }));
    const t0 = performance.now();
    (function frame(now) {
      const el = now - t0;
      g.clearRect(0, 0, W, H);
      for (const q of parts) {
        q.vy += H * 0.0009; q.x += q.vx; q.y += q.vy; q.r += q.vr; q.vx *= 0.99;
        g.save(); g.translate(q.x, q.y); g.rotate(q.r); g.globalAlpha = Math.max(0, 1 - el / 3000);
        g.fillStyle = q.c; g.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); g.restore();
      }
      if (el < 3000) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }

  // Header: the sound switch and the piece set
  const sb = $('soundBtn');
  const drawSound = () => { sb.textContent = soundOn ? '🔊' : '🔇'; sb.setAttribute('aria-pressed', String(soundOn)); };
  sb.addEventListener('click', () => {
    soundOn = !soundOn;
    try { localStorage.setItem('gambit-sound', soundOn ? '1' : '0'); } catch (e) {}
    drawSound(); sound('move');
  });
  drawSound();
  const ps = $('pieceSet');
  try { const v = localStorage.getItem('gambit-pieces'); if (v && ps.querySelector(`[value="${v}"]`)) ps.value = v; } catch (e) {}
  const applyPieces = () => { document.documentElement.dataset.pieces = ps.value; try { localStorage.setItem('gambit-pieces', ps.value); } catch (e) {} };
  ps.addEventListener('change', applyPieces);
  applyPieces();

  return { sound, slide, toast, confetti };
})();
</script>

<script>
// ---------- Leaderboard, friends and invitations ----------
window.gambitSocial = (() => {
  'use strict';
  const t = (k, v) => window.gambitI18n.t(k, v);
  const $ = id => document.getElementById(id);
  const A = window.gambitAuth, fx = window.gambitFx;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (!A || !A.available) return {};
  let modal = null, lbGame = 'chess', lbRows = null, lbErr = '';
  let friends = null, friendsUid = null, frMsg = '', frOk = false;
  const signedIn = () => !!(A.user() && A.profile());

  function open(m) { modal = m; frMsg = ''; $('xModal').hidden = false; draw(); if (m === 'leaders') loadLeaders(); else loadFriends(); }
  function close() { $('xModal').hidden = true; modal = null; }
  function draw() {
    if (!modal) return;
    const head = title => `<div class="modal-head"><h2 id="xTitle">${title}</h2><button class="b x" data-x="close" aria-label="${t('cancel')}">×</button></div>`;
    $('xBox').innerHTML = modal === 'leaders' ? head(t('lbTitle')) + drawLeaders() : head(t('frTitle')) + drawFriends();
  }

  // ---------- Leaderboard ----------
  async function loadLeaders() {
    lbRows = null; lbErr = ''; draw();
    const game = lbGame;
    try {
      const snap = await A.db().collection('leaders').orderBy('elo.' + game, 'desc').limit(100).get();
      if (game !== lbGame) return;
      lbRows = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.rated && r.rated[game] > 0).slice(0, 50);
    } catch (e) { lbErr = A.errText(e); lbRows = []; }
    if (modal === 'leaders') draw();
  }
  function drawLeaders() {
    let h = `<div class="tabs" role="tablist">${['chess', 'checkers'].map(g => `<button class="b" role="tab" data-lb="${g}" aria-selected="${g === lbGame}">${t(g === 'chess' ? 'gChess' : 'gCheckers')}</button>`).join('')}</div>`;
    if (!lbRows) return h + `<div class="hint">${t('adLoading')}</div>`;
    if (lbErr) return h + `<div class="warn">${esc(lbErr)}</div>`;
    if (!lbRows.length) return h + `<div class="hint">${t('lbEmpty')}</div>`;
    const me = A.user() && A.user().uid, known = new Set((friends || []).map(f => f.id));
    return h + '<div class="table-wrap"><table class="lb"><tbody>' + lbRows.map((r, i) => `<tr class="${r.id === me ? 'me' : ''}">
        <td class="rk">${i + 1}</td>
        <td>${A.badge({ nick: r.nick, elo: r.elo[lbGame], country: r.country, admin: r.admin })}</td>
        <td class="r hint">${t('lbGames', { n: r.rated[lbGame] })}</td>
        <td class="r">${signedIn() && r.id !== me && !known.has(r.id) ? `<button class="b" data-addf="${esc(r.id)}" data-nick="${esc(r.nick)}" title="${t('frAdd')}" aria-label="${t('frAdd')}">+</button>` : ''}</td></tr>`).join('')
      + '</tbody></table></div>';
  }

  // ---------- Friends ----------
  const fcol = () => A.db().collection('users').doc(A.user().uid).collection('friends');
  async function loadFriends() {
    if (!signedIn()) { friends = []; return; }
    const uid = A.user().uid;
    try {
      const snap = await fcol().get();
      const list = snap.docs.map(d => ({ id: d.id, nick: d.data().nick }));
      // Rating, flag and "last seen" come from the friend's public leaderboard entry
      await Promise.all(list.map(async f => {
        try { const l = await A.db().collection('leaders').doc(f.id).get(); if (l.exists) f.info = l.data(); } catch (e) {}
      }));
      if (!A.user() || A.user().uid !== uid) return;
      friends = list.sort((a, b) => a.nick.localeCompare(b.nick));
    } catch (e) { friends = []; frMsg = A.errText(e); frOk = false; }
    draw();
  }
  async function addFriend(nick, id) {
    nick = String(nick || '').trim();
    try {
      if (!id) {
        const lower = nick.toLowerCase();
        if (!/^[a-z0-9_]{3,16}$/.test(lower)) { frMsg = t('frNotFound', { n: nick }); frOk = false; draw(); return; }
        const n = await A.db().collection('nicks').doc(lower).get();
        if (!n.exists) { frMsg = t('frNotFound', { n: nick }); frOk = false; draw(); return; }
        id = n.data().uid;
        try { const l = await A.db().collection('leaders').doc(id).get(); if (l.exists && l.data().nick) nick = l.data().nick; } catch (e) {}
      }
      if (id === A.user().uid) { frMsg = t('frSelf'); frOk = false; draw(); return; }
      await fcol().doc(id).set({ nick });
      frMsg = t('frAdded', { n: nick }); frOk = true;
      await loadFriends();
    } catch (e) { frMsg = A.errText(e); frOk = false; draw(); }
  }
  async function removeFriend(id) { try { await fcol().doc(id).delete(); } catch (e) {} await loadFriends(); }
  function seenText(ts) {
    if (!ts || !ts.toMillis) return '';
    const min = Math.max(0, Math.floor((Date.now() - ts.toMillis()) / 60000));
    if (min < 5) return `<span class="seen on">● ${t('frOnline')}</span>`;
    const ago = min < 60 ? t('frMin', { n: min }) : min < 1440 ? t('frHour', { n: Math.floor(min / 60) }) : t('frDay', { n: Math.floor(min / 1440) });
    return `<span class="seen">${t('frSeen', { a: ago })}</span>`;
  }
  function drawFriends() {
    if (!signedIn()) return `<div class="hint">${t('onNeedLogin')}</div>`;
    let h = `<form class="inline-form" data-x="add"><input id="frNick" maxlength="16" autocomplete="off" placeholder="${t('frNickPh')}" aria-label="${t('frNickPh')}"><button class="b primary">${t('frAdd')}</button></form>`;
    if (frMsg) h += `<div class="${frOk ? 'okmsg' : 'warn'}" role="alert">${esc(frMsg)}</div>`;
    if (!A.canPlay()) h += `<div class="hint">${t('frNeedVerify')}</div>`;
    if (!friends) return h + `<div class="hint">${t('adLoading')}</div>`;
    if (!friends.length) return h + `<div class="hint">${t('frNone')}</div>`;
    const g = window.gambitCurrentGame ? window.gambitCurrentGame() : 'chess';
    return h + '<div class="fl">' + friends.map(f => {
      const i = f.info || {};
      const inv = A.canPlay() ? `<button class="b" data-inv="chess" data-id="${esc(f.id)}" data-nick="${esc(i.nick || f.nick)}">${t('frInvChess')}</button>`
        + `<button class="b" data-inv="checkers" data-id="${esc(f.id)}" data-nick="${esc(i.nick || f.nick)}">${t('frInvCk')}</button>` : '';
      return `<div class="frow"><div>${A.badge({ nick: i.nick || f.nick, elo: i.elo ? i.elo[g] : 1000, country: i.country, admin: i.admin })}${seenText(i.seen)}</div>
        <div class="btns">${inv}<button class="b danger" data-rmf="${esc(f.id)}" aria-label="${t('frRemove')}" title="${t('frRemove')}">×</button></div></div>`;
    }).join('') + '</div>';
  }

  // ---------- Invitations to a game ----------
  let invUnsub = null, invUid = null;
  const shown = new Set();
  function listenInvites() {
    const uid = signedIn() ? A.user().uid : null;
    if (uid === invUid) return;
    if (invUnsub) invUnsub();
    invUnsub = null; invUid = uid;
    if (!uid) return;
    invUnsub = A.db().collection('invites').where('to', '==', uid).onSnapshot(snap => {
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed') continue;
        const d = ch.doc.data(), ref = ch.doc.ref;
        const at = d.at && d.at.toMillis ? d.at.toMillis() : Date.now();
        if (Date.now() - at > 180000) { ref.delete().catch(() => {}); continue; }
        const key = ch.doc.id + ':' + d.code;
        if (shown.has(key)) continue;
        shown.add(key);
        fx.sound('notify');
        const tt = fx.toast(`<div>${t('invText', { n: esc(d.fromNick), g: t(d.game === 'checkers' ? 'invCk' : 'invChess') })}</div>
          <div class="btns"><button class="b primary" data-y>${t('invAccept')}</button><button class="b" data-n>${t('invDecline')}</button></div>`, 90000);
        tt.el.addEventListener('click', e => {
          if (e.target.closest('[data-y]')) { tt.close(); ref.delete().catch(() => {}); window.gambitNet.joinGame(d.game === 'checkers' ? 'checkers' : 'chess', d.code); }
          else if (e.target.closest('[data-n]')) { tt.close(); ref.delete().catch(() => {}); }
        });
      }
    }, () => {});
  }

  function onAccount() {
    $('lbBtn').hidden = false;
    $('friendsBtn').hidden = !signedIn();
    const uid = signedIn() ? A.user().uid : null;
    if (uid !== friendsUid) { friendsUid = uid; friends = null; if (uid) loadFriends(); }
    listenInvites();
    if (modal) draw();
  }
  A.onChange(onAccount);
  $('lbBtn').addEventListener('click', () => open('leaders'));
  $('friendsBtn').addEventListener('click', () => open('friends'));
  $('xModal').addEventListener('click', e => {
    if (e.target === $('xModal')) { close(); return; }
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.x === 'close') close();
    else if (b.dataset.lb) { lbGame = b.dataset.lb; loadLeaders(); }
    else if (b.dataset.addf) { b.disabled = true; addFriend(b.dataset.nick, b.dataset.addf); }
    else if (b.dataset.rmf) removeFriend(b.dataset.rmf);
    else if (b.dataset.inv) { close(); window.gambitNet.invite(b.dataset.inv, b.dataset.id, b.dataset.nick); }
  });
  $('xModal').addEventListener('submit', e => { e.preventDefault(); const v = $('frNick') ? $('frNick').value : ''; if (v.trim()) addFriend(v); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('xModal').hidden) close(); });
  document.addEventListener('gambit-lang', draw);
  return { open };
})();
</script>

    TT.set(k, { depth, v: best, flag: best <= a0 ? -1 : best >= beta ? 1 : 0, move: bestMove });

    for (let d = 1; d <= maxDepth; d++) {

      let alpha = -Infinity, bm = null, bs = -Infinity;
      for (const m of roots) {

        if (v > alpha) alpha = v;

      result = { move: bm, score: bs, depth: d };

}

// Easy: a random move, grabbing a piece about half the time
function dumbMove(s) {
  const ms = legal(s), caps = ms.filter(m => m.cap);
  const pool = caps.length && Math.random() < 0.5 ? caps : ms;
  return pool[Math.floor(Math.random() * pool.length)];
}

// Medium and hard: a real search; `noise` (in centipawns) blurs its judgement
function searchMove(s, depth, noise) {
  const ms = legal(s);
  order(ms);
  let best = ms[0], bestV = -Infinity;
  for (const m of ms) {
    make(s, m);
    const v = -negamax(s, depth - 1, -Infinity, Infinity, 1) + (Math.random() - 0.5) * 2 * noise;
    unmake(s);
    if (v > bestV) { bestV = v; best = m; }
  }
  return best;
}

function botMove(s, level) {
  if (level === 'easy') return dumbMove(s);
  if (level === 'medium') return Math.random() < 0.15 ? dumbMove(s) : searchMove(s, 2, 60);
  const endgame = s.b.filter(Boolean).length <= 10;
  // Impossible: one ply deeper than hard and no deliberate slips
  if (level === 'impossible') return searchMove(s, endgame ? 5 : 4, 0);
  return searchMove(s, endgame ? 4 : 3, 8);
}

// ---------- Post-game report ----------
const CLS = {
  brill: { s: '!!' }, best: { s: '★' }, good: { s: '' }, inacc: { s: '?!' }, mist: { s: '?' }, blun: { s: '??' }
