<style>
/* Layout: board as the hero on the left, a narrow "scoresheet" column on the right; stacks on phones. */
:root {

}

}
:root[data-theme="dark"] {
  --bg: #10141c; --panel: #181e2a; --fg: #e6eaf1; --muted: #8f9aae; --line: #2a3344;

}

}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }

<body>
<div class="wrap">
  <header>
    <h1>Гамбит<span>.</span></h1>
    <nav class="games" aria-label="Игра / Game">
      <button class="b" data-game="chess" data-t="gChess">Шахматы</button>
      <button class="b" data-game="checkers" data-t="gCheckers">Шашки</button>

    <div class="tag" data-t="tag">Шахматы по всем правилам: рокировка, взятие на проходе, превращение пешки</div>
    <div class="acct" id="acct" hidden></div>
    <div class="lang" role="group" aria-label="Язык / Language">
      <button class="b" id="langRu" data-lang="ru">RU</button>
      <button class="b" id="langEn" data-lang="en">EN</button>
    </div>
  </header>

  <div class="main" id="chessApp">
    <div class="board-wrap">
      <div class="review" id="review" hidden>
        <div class="rev-text" id="revText"></div>
        <div class="btns">
          <button class="b" id="revPrev" data-ta="prev" aria-label="Предыдущий ход">◀</button>
          <button class="b" id="revNext" data-ta="next" aria-label="Следующий ход">▶</button>
          <button class="b primary" id="revExit" data-t="exit">К текущей позиции</button>
        </div>
      </div>
      <div class="frame"><div class="board" id="board" role="grid" data-ta="board" aria-label="Шахматная доска"></div></div>
    </div>

    <aside class="side">
      <div class="card">
        <div class="status" id="status" aria-live="polite"></div>
        <div class="rating-note" id="ratingNote" aria-live="polite"></div>
        <div class="caps">
          <div id="capTop"></div>
          <div id="capBot"></div>
        </div>
      </div>

      <div class="card">
        <label class="field" for="mode"><span data-t="mode">Режим</span>
          <select id="mode">
            <option value="ai" data-t="ai">Против компьютера</option>
            <option value="pvp" data-t="pvp">Вдвоём за одной доской</option>
            <option value="online" data-t="online">Онлайн с другом</option>
          </select>
        </label>
        <div class="row2" id="aiOpts">
          <label class="field" for="side"><span data-t="side">Играю за</span>
            <select id="side">
              <option value="w" data-t="white">Белых</option>
              <option value="b" data-t="black">Чёрных</option>
            </select>
          </label>
          <label class="field" for="level"><span data-t="level">Сложность</span>
            <select id="level">
              <option value="easy" data-t="easy">Лёгкая</option>
              <option value="medium" data-t="medium">Средняя</option>
              <option value="hard" data-t="hard">Сложная</option>
            </select>
            <span class="bot-elo" id="botElo"></span>
          </label>
        </div>
        <div class="online" id="onlineBox" hidden></div>
        <div class="btns">
          <button class="b primary" id="newBtn" data-t="newg">Новая партия</button>

      <h2 data-t="adTitle">Админ-панель</h2>

        <button class="b" id="adminRefresh" data-t="adRefresh">Обновить</button>

      </div>
    </div>
    <div class="stats" id="adminStats"></div>
    <div class="card">
      <div class="sheet-h"><h2 data-t="adPlayersH">Игроки</h2></div>
      <label class="field" for="adminSearch"><span data-t="adSearch">Поиск по нику</span><input id="adminSearch" type="search" autocomplete="off"></label>

  <div class="main" id="checkersApp" hidden>
    <div class="board-wrap">
      <div class="frame"><div class="board" id="ckBoard" role="grid" data-ta="ckBoardLbl" aria-label="Доска для шашек"></div></div>

      <div class="card">
        <div class="status" id="ckStatus" aria-live="polite"></div>
        <div class="rating-note" id="ckRatingNote" aria-live="polite"></div>
        <div class="tag" id="ckLeft"></div>
      </div>

      <div class="card">
        <label class="field" for="ckMode"><span data-t="mode">Режим</span>
          <select id="ckMode">
            <option value="ai" data-t="ai">Против компьютера</option>
            <option value="pvp" data-t="pvp">Вдвоём за одной доской</option>
            <option value="online" data-t="online">Онлайн с другом</option>
          </select>
        </label>
        <div class="row2" id="ckAiOpts">
          <label class="field" for="ckSide"><span data-t="side">Играю за</span>
            <select id="ckSide">
              <option value="w" data-t="white">Белых</option>
              <option value="b" data-t="black">Чёрных</option>
            </select>
          </label>
          <label class="field" for="ckLevel"><span data-t="level">Сложность</span>
            <select id="ckLevel">
              <option value="easy" data-t="easy">Лёгкая</option>
              <option value="medium" data-t="medium">Средняя</option>
              <option value="hard" data-t="hard">Сложная</option>
            </select>
            <span class="bot-elo" id="ckBotElo"></span>
          </label>
        </div>
        <div class="online" id="ckOnlineBox" hidden></div>
        <div class="btns">
          <button class="b primary" id="ckNew" data-t="newg">Новая партия</button>
          <button class="b" id="ckUndo" data-t="undo">Отменить ход</button>
          <button class="b" id="ckFlip" data-t="flip">Перевернуть</button>
        </div>
      </div>

      <div class="card">
        <div class="sheet-h"><h2 data-t="sheet">Запись партии</h2><small data-t="ckLegend">c3-d4 ход, c3:e5 взятие</small></div>
        <div class="moves" id="ckMoves"></div>
      </div>

      <div class="card">
        <div class="sheet-h"><h2 data-t="ckRulesH">Правила</h2></div>
        <p class="rules" data-t="ckRules"></p>

<div class="modal" id="authModal" hidden>
  <div class="modal-box" id="authBox" role="dialog" aria-modal="true" aria-labelledby="authTitle"></div>
</div>

<script>
// ---------- Accounts and the admin panel (Firebase Auth + Firestore) ----------
// The page only shows what the Firestore rules allow; bans and admin rights are enforced there.
window.gambitAuth = (() => {
  'use strict';
  const t = (k, v) => window.gambitI18n.t(k, v);
  const $ = id => document.getElementById(id);
  const cfg = window.GAMBIT_FIREBASE;
  const available = !!(cfg && window.firebase && !window.claude);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let auth = null, db = null, user = null, profile = null, admin = false, ready = false;
  const readyWaiters = [], changeListeners = [];
  let afterLogin = null;

  const ts = () => window.firebase.firestore.FieldValue.serverTimestamp();
  const emit = () => { for (const f of changeListeners) f(); };

  function errText(e) {
    const code = (e && e.code) || '';
    const map = {
      'auth/email-already-in-use': 'aeEmailUsed', 'auth/invalid-email': 'aeEmailBad', 'auth/weak-password': 'aeWeak',
      'auth/invalid-credential': 'aeWrong', 'auth/wrong-password': 'aeWrong', 'auth/user-not-found': 'aeWrong',
      'auth/invalid-login-credentials': 'aeWrong', 'auth/too-many-requests': 'aeTooMany', 'auth/network-request-failed': 'aeNetwork',
      'auth/missing-password': 'aeWeak', 'nick-taken': 'aeNickTaken', 'nick-bad': 'aeNickBad', 'nick-reserved': 'aeNickReserved',
      'permission-denied': 'aeDenied', 'unavailable': 'aeNetwork'
    };
    return map[code] ? t(map[code]) : t('aeOther', { e: code || (e && e.message) || String(e) });
  }

  // Sign-up loads the profile twice at once (sign-in event and profile creation): only the latest load counts
  let loadSeq = 0;
  async function loadProfile(u) {
    const mine = ++loadSeq;
    let p = null, a = false;
    try {
      const snap = await db.collection('users').doc(u.uid).get();
      if (snap.exists) {
        p = snap.data();
        db.collection('users').doc(u.uid).update({ lastSeen: ts() }).catch(() => {});
      }
      // Only the admin may list players, so a successful read means admin rights
      a = await db.collection('users').limit(1).get().then(() => true, () => false);
    } catch (e) {}
    if (mine === loadSeq) { profile = p; admin = a; }
  }

  async function createProfile(nick, country) {
    const u = auth.currentUser, lower = nick.toLowerCase();
    const batch = db.batch();
    batch.set(db.collection('nicks').doc(lower), { uid: u.uid });
    batch.set(db.collection('users').doc(u.uid), {
      nick, nickLower: lower, createdAt: ts(), lastSeen: ts(), games: 0, banned: false,
      country: country || '', elo: { chess: 1000, checkers: 1000 }, rated: { chess: 0, checkers: 0 }
    });
    try { await batch.commit(); }
    catch (e) {
      if (e.code === 'permission-denied') {
        const taken = await db.collection('nicks').doc(lower).get().catch(() => null);
        const err = new Error(); err.code = taken && taken.exists ? 'nick-taken' : lower === 'itzkartoh' ? 'nick-reserved' : 'permission-denied';
        throw err;
      }
      throw e;
    }
    await loadProfile(u);
  }

  // ---------- Ratings and the player badge ----------
  const COUNTRIES = 'ad ae af ag ai al am ao ar as at au aw ax az ba bb bd be bf bg bh bi bj bl bm bn bo br bs bt bw by bz ca cd cf cg ch ci ck cl cm cn co cr cu cv cw cy cz de dj dk dm do dz ec ee eg er es et fi fj fk fm fo fr ga gb gd ge gg gh gi gl gm gn gq gr gt gu gw gy hk hn hr ht hu id ie il im in iq ir is it je jm jo jp ke kg kh ki km kn kp kr kw ky kz la lb lc li lk lr ls lt lu lv ly ma mc md me mg mh mk ml mm mn mo mp mr ms mt mu mv mw mx my mz na nc ne ng ni nl no np nr nu nz om pa pe pf pg ph pk pl pr ps pt pw py qa re ro rs ru rw sa sb sc sd se sg si sk sl sm sn so sr ss st sv sx sy sz tc td tg th tj tl tm tn to tr tt tv tw tz ua ug us uy uz va vc ve vg vi vn vu ws xk ye za zm zw'.split(' ');
  const eloOf = (p, game) => (p && p.elo && p.elo[game]) || 1000;
  const ratedOf = (p, game) => (p && p.rated && p.rated[game]) || 0;
  function regionName(cc) {
    try { return new Intl.DisplayNames([document.documentElement.lang || 'ru'], { type: 'region' }).of(cc.toUpperCase()); }
    catch (e) { return cc.toUpperCase(); }
  }
  function flag(cc) {
    if (!/^[a-z]{2}$/.test(cc || '')) return '';
    const name = esc(regionName(cc));
    return `<img class="flag" src="https://flagcdn.com/w20/${cc}.png" srcset="https://flagcdn.com/w40/${cc}.png 2x" width="20" height="15" alt="${name}" title="${name}">`;
  }
  // ADMIN Kartoh (1000) [flag]
  function badge(p) {
    return `<span class="player">${p.admin ? '<span class="title-badge">ADMIN</span>' : ''}<span class="bn">${esc(p.nick)}</span>`
      + `<span class="belo">(${p.elo == null ? 1000 : p.elo})</span>${flag(p.country)}</span>`;
  }
  function countrySelect(id, value) {
    const opts = COUNTRIES.map(c => [c, regionName(c)]).sort((a, b) => a[1].localeCompare(b[1]));
    return `<label class="field" for="${id}">${t('acCountry')}<select id="${id}"><option value="">${t('acNoCountry')}</option>`
      + opts.map(([c, n]) => `<option value="${c}"${c === value ? ' selected' : ''}>${esc(n)}</option>`).join('') + '</select></label>';
  }
  function guessCountry() {
    const m = /-([A-Za-z]{2})$/.exec(navigator.language || '');
    const c = m ? m[1].toLowerCase() : '';
    return COUNTRIES.includes(c) ? c : '';
  }
  // Standard Elo: K = 40 for the first 20 games, then 20
  async function rate(game, oppElo, score) {
    if (!(user && profile && !profile.banned)) return null;
    const old = eloOf(profile, game), n = ratedOf(profile, game);
    const K = n < 20 ? 40 : 20;
    const expected = 1 / (1 + Math.pow(10, (oppElo - old) / 400));
    const next = Math.max(100, Math.min(3500, old + Math.round(K * (score - expected))));
    const elo = { chess: eloOf(profile, 'chess'), checkers: eloOf(profile, 'checkers'), [game]: next };
    const rated = { chess: ratedOf(profile, 'chess'), checkers: ratedOf(profile, 'checkers'), [game]: n + 1 };
    try {
      await db.collection('users').doc(user.uid).update({ elo, rated, lastRated: ts() });
      profile.elo = elo; profile.rated = rated;
      renderAcct();
      return { old, next, delta: next - old };
    } catch (e) {
      return { error: e.code === 'permission-denied' ? 'fast' : 'fail' };
    }
  }
  const currentGame = () => (window.gambitCurrentGame ? window.gambitCurrentGame() : 'chess');

  function checkNick(nick) {
    if (!/^[A-Za-z0-9_]{3,16}$/.test(nick)) { const e = new Error(); e.code = 'nick-bad'; throw e; }
  }

  // ---------- Header ----------
  function renderAcct() {
    const el = $('acct');
    if (!available) { el.hidden = true; return; }
    el.hidden = false;
    if (!ready) { el.innerHTML = ''; return; }
    if (!user) { el.innerHTML = `<button class="b" data-a="login">${t('acLogin')}</button>`; return; }
    const name = profile
      ? badge({ nick: profile.nick, elo: eloOf(profile, currentGame()), country: profile.country, admin })
      : esc(user.email);
    el.innerHTML = `<span class="who${profile && profile.banned ? ' banned' : ''}" title="${esc(user.email)}">${name}${profile && profile.banned ? ' · ' + t('acBanned') : ''}</span>`
      + (!profile ? `<button class="b primary" data-a="finish">${t('acFinish')}</button>` : `<button class="b" data-a="profile">${t('acProfile')}</button>`)
      + (admin ? `<button class="b" data-a="admin">${t('acAdmin')}</button>` : '')
      + `<button class="b" data-a="logout">${t('acLogout')}</button>`;
  }

  // ---------- Sign-in dialog ----------
  let mode = 'login', msg = '', msgOk = false, busy = false;
  function openModal(m) { mode = m || (user && !profile ? 'nick' : 'login'); msg = ''; drawModal(); $('authModal').hidden = false; setTimeout(() => { const f = $('authModal').querySelector('input'); if (f) f.focus(); }, 30); }
  function closeModal() { $('authModal').hidden = true; }
  function drawModal() {
    const box = $('authBox');
    const tabs = mode === 'nick' || mode === 'profile' ? '' : `<div class="tabs" role="tablist">
        <button class="b" role="tab" data-m="login" aria-selected="${mode === 'login'}">${t('acLogin')}</button>
        <button class="b" role="tab" data-m="register" aria-selected="${mode === 'register'}">${t('acRegister')}</button></div>`;
    const f = (id, type, label, ac, extra = '') => `<label class="field" for="${id}">${label}<input id="${id}" type="${type}" autocomplete="${ac}" ${extra}></label>`;
    let body = '';
    if (mode === 'login') body = f('auEmail', 'email', t('acEmail'), 'email') + f('auPass', 'password', t('acPass'), 'current-password');
    else if (mode === 'register') body = f('auNick', 'text', t('acNick'), 'username', 'maxlength="16"') + `<div class="hint">${t('acNickHint')}</div>`
      + countrySelect('auCountry', guessCountry())
      + f('auEmail', 'email', t('acEmail'), 'email') + f('auPass', 'password', t('acPass'), 'new-password') + `<div class="hint">${t('acPassHint')}</div>`;
    else if (mode === 'profile') body = `<div>${badge({ nick: profile.nick, elo: eloOf(profile, currentGame()), country: profile.country, admin })}</div>`
      + countrySelect('auCountry', profile.country || '');
    else body = `<p class="hint">${t('acNickStep')}</p>` + f('auNick', 'text', t('acNick'), 'username', 'maxlength="16"') + `<div class="hint">${t('acNickHint')}</div>`
      + countrySelect('auCountry', guessCountry());
    const label = mode === 'login' ? t('acLogin') : mode === 'register' ? t('acCreate') : t('acSave');
    box.innerHTML = `<div class="modal-head"><h2 id="authTitle">${mode === 'nick' ? t('acFinish') : mode === 'profile' ? t('acProfile') : t('acTitle')}</h2>
        <button class="b x" data-a="close" aria-label="${t('cancel')}">×</button></div>${tabs}
      <form id="authForm" class="auth-form">${body}
        ${msg ? `<div class="${msgOk ? 'okmsg' : 'warn'}" role="alert">${esc(msg)}</div>` : ''}
        <button class="b primary" ${busy ? 'disabled' : ''}>${busy ? '…' : label}</button>
        ${mode === 'login' ? `<button type="button" class="linkbtn" data-a="reset">${t('acForgot')}</button>` : ''}
      </form>`;
  }
  async function submit() {
    // Read the form before redrawing it: the redraw replaces the inputs
    const v = id => ($(id) ? $(id).value.trim() : '');
    const nick = v('auNick'), email = v('auEmail'), pass = $('auPass') ? $('auPass').value : '', country = v('auCountry');
    busy = true; msg = ''; drawModal();
    const keep = () => {
      if ($('auNick')) $('auNick').value = nick;
      if ($('auEmail')) $('auEmail').value = email;
      if ($('auCountry')) $('auCountry').value = country;
    };
    keep();
    try {
      if (mode === 'login') {
        await auth.signInWithEmailAndPassword(email, pass);
      } else if (mode === 'register') {
        checkNick(nick);
        const taken = await db.collection('nicks').doc(nick.toLowerCase()).get();
        if (taken.exists) { const e = new Error(); e.code = 'nick-taken'; throw e; }
        pendingNick = nick;
        await auth.createUserWithEmailAndPassword(email, pass);
        await createProfile(nick, country);
      } else if (mode === 'profile') {
        await db.collection('users').doc(user.uid).update({ country });
        profile.country = country;
        busy = false; msg = t('acSaved'); msgOk = true; drawModal(); keep(); renderAcct(); emit();
        return;
      } else {
        checkNick(nick);
        await createProfile(nick, country);
      }
      busy = false;
      if (!profile) { mode = 'nick'; drawModal(); return; }
      closeModal(); renderAcct(); emit();
      const next = afterLogin; afterLogin = null;
      if (next && !profile.banned) next();
    } catch (e) {
      busy = false;
      if (e.code === 'verify') { msg = t('acVerify', { e: auth.currentUser.email }); msgOk = true; mode = 'nick'; }
      else { msg = errText(e); msgOk = false; if (auth.currentUser && mode === 'register') mode = 'nick'; }
      drawModal();
      keep();
      if (mode === 'nick' && pendingNick && $('auNick')) $('auNick').value = pendingNick;
    }
  }
  let pendingNick = '';

  // ---------- Admin panel ----------
  let users = [], adminQuery = '';
  const fmtDate = d => (d && d.toDate ? d.toDate().toLocaleString(document.documentElement.lang === 'en' ? 'en-GB' : 'ru-RU', { dateStyle: 'short', timeStyle: 'short' }) : '—');
  async function openAdmin() {
    if (!admin) return;
    $('chessApp').hidden = true; $('checkersApp').hidden = true; $('adminApp').hidden = false;
    await loadAdmin();
  }
  async function loadAdmin() {
    $('adminStats').innerHTML = `<div class="hint">${t('adLoading')}</div>`;
    try {
      const day = new Date(); day.setHours(0, 0, 0, 0);
      const week = new Date(Date.now() - 7 * 864e5), month = new Date(Date.now() - 30 * 864e5);
      const [us, gs] = await Promise.all([
        db.collection('users').orderBy('createdAt', 'desc').limit(1000).get(),
        db.collection('games').where('createdAt', '>=', month).get()
      ]);
      users = us.docs.map(d => ({ id: d.id, ...d.data() }));
      const games = gs.docs.map(d => d.data()).filter(g => g.createdAt && g.createdAt.toDate);
      const since = d => games.filter(g => g.createdAt.toDate() >= d).length;
      const online = users.filter(u => u.lastSeen && u.lastSeen.toDate && Date.now() - u.lastSeen.toDate() < 864e5).length;
      const tiles = [
        [t('adPlayers'), users.length], [t('adActive'), online], [t('adBannedN'), users.filter(u => u.banned).length],
        [t('adToday'), since(day)], [t('adWeek'), since(week)], [t('adMonth'), games.length],
        [t('gChess'), games.filter(g => g.game === 'chess').length], [t('gCheckers'), games.filter(g => g.game === 'checkers').length]
      ];
      $('adminStats').innerHTML = tiles.map(([k, v]) => `<div class="tile"><div class="tv">${v}</div><div class="tk">${esc(k)}</div></div>`).join('');
      drawUsers();
    } catch (e) {
      $('adminStats').innerHTML = `<div class="warn">${esc(errText(e))}</div>`;
    }
  }
  function drawUsers() {
    const q = adminQuery.toLowerCase();
    const rows = users.filter(u => !q || (u.nickLower || '').includes(q));
    $('adminUsers').innerHTML = `<thead><tr><th>${t('acNick')}</th><th>${t('adJoined')}</th><th>${t('adSeen')}</th><th>${t('adGames')}</th><th>${t('adElo')}</th><th>${t('adStatus')}</th><th></th></tr></thead><tbody>`
      + (rows.length ? rows.map(u => `<tr>
          <td class="nick">${badge({ nick: u.nick, elo: eloOf(u, currentGame()), country: u.country, admin: u.id === user.uid })}</td><td>${fmtDate(u.createdAt)}</td><td>${fmtDate(u.lastSeen)}</td><td class="num">${u.games || 0}</td>
          <td class="num">${eloOf(u, 'chess')} / ${eloOf(u, 'checkers')}</td>
          <td>${u.banned ? `<span class="pill bad">${t('adBannedOne')}</span>` : `<span class="pill good">${t('adActiveOne')}</span>`}</td>
          <td>${u.id === user.uid ? `<span class="hint">${t('adYou')}</span>` : `<button class="b${u.banned ? '' : ' danger'}" data-ban="${u.id}" data-to="${!u.banned}">${u.banned ? t('adUnban') : t('adBan')}</button>`}</td>
        </tr>`).join('') : `<tr><td colspan="7" class="hint">${t('adNone')}</td></tr>`) + '</tbody>';
  }
  async function setBan(id, to, btn) {
    btn.disabled = true;
    try {
      await db.collection('users').doc(id).update({ banned: to });
      const u = users.find(x => x.id === id); if (u) u.banned = to;
      drawUsers();
    } catch (e) { btn.disabled = false; btn.textContent = errText(e); }
  }

  // ---------- Wiring ----------
  function init() {
    renderAcct();
    if (!available) return;
    window.firebase.initializeApp(cfg);
    auth = window.firebase.auth();
    db = window.firebase.firestore();
    // Local testing against the Firebase emulators: http://localhost:<port>/?emu
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('emu')) {
      auth.useEmulator('http://127.0.0.1:9099');
      db.useEmulator('127.0.0.1', 8085);
    }
    auth.onAuthStateChanged(async u => {
      user = u;
      if (u) await loadProfile(u); else { profile = null; admin = false; }
      ready = true;
      renderAcct(); emit();
      while (readyWaiters.length) readyWaiters.shift()();
      if (u && !profile && $('authModal').hidden) openModal('nick');
    });
    $('acct').addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'login') openModal('login');
      else if (a === 'finish') openModal('nick');
      else if (a === 'profile') openModal('profile');
      else if (a === 'logout') { auth.signOut(); $('adminApp').hidden = true; window.gambitSetGame && window.gambitSetGame(); }
      else if (a === 'admin') openAdmin();
    });
    $('authModal').addEventListener('click', e => {
      if (e.target === $('authModal')) { closeModal(); return; }
      const m = e.target.closest('[data-m]');
      if (m) { mode = m.dataset.m; msg = ''; drawModal(); return; }
      const b = e.target.closest('[data-a]'); if (!b) return;
      if (b.dataset.a === 'close') closeModal();
      else if (b.dataset.a === 'reset') {
        const email = $('auEmail').value.trim();
        if (!email) { msg = t('aeEmailBad'); msgOk = false; drawModal(); return; }
        auth.sendPasswordResetEmail(email).then(() => { msg = t('acResetSent'); msgOk = true; drawModal(); }, err => { msg = errText(err); msgOk = false; drawModal(); });
      }
    });
    $('authModal').addEventListener('submit', e => { e.preventDefault(); if (!busy) submit(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('authModal').hidden) closeModal(); });
    $('adminBack').addEventListener('click', () => { $('adminApp').hidden = true; window.gambitSetGame && window.gambitSetGame(); });
    $('adminRefresh').addEventListener('click', loadAdmin);
    $('adminSearch').addEventListener('input', e => { adminQuery = e.target.value.trim(); drawUsers(); });
    $('adminUsers').addEventListener('click', e => { const b = e.target.closest('[data-ban]'); if (b) setBan(b.dataset.ban, b.dataset.to === 'true', b); });
    document.addEventListener('gambit-game', renderAcct);
    document.addEventListener('gambit-lang', () => { renderAcct(); if (!$('authModal').hidden) drawModal(); if (!$('adminApp').hidden) loadAdmin(); });
  }

  return {
    available, init, errText,
    db: () => db,
    onReady: f => (ready ? f() : readyWaiters.push(f)),
    onChange: f => changeListeners.push(f),
    user: () => user, profile: () => profile,
    elo: game => eloOf(profile, game), country: () => (profile && profile.country) || '', isAdmin: () => admin,
    // Re-read the profile (the rating may have changed in another tab) before it goes into a game
    refresh: async () => { if (user) { await loadProfile(user); renderAcct(); } },
    badge, rate,
    canPlay: () => !!(user && profile && !profile.banned),
    banned: () => !!(profile && profile.banned),
    // Ask the player to sign in, then carry on with what they were doing
    prompt: next => { afterLogin = next || null; openModal(user ? 'nick' : 'login'); },
    ts
  };
})();
</script>

<script>
// ---------- Online play: one Firestore document per game ----------
// The document holds the whole game (round, moves, resignation); both players listen to it live.
// The Firestore rules let only signed-in, unbanned players create, join and move.
window.gambitNet = (() => {
  'use strict';
  const t = (k, v) => window.gambitI18n.t(k, v);
  const A = window.gambitAuth;
  const available = !!(A && A.available);
  const hooks = {};
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clean = raw => String(raw || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);

  function makeCode() {
    const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }

  function create(game, box, cb) {
    let state = 'idle', code = '', myColor = null, opp = null, err = '', copied = false, unsub = null, ref = null;
    const roomKey = 'gambit-room-' + game;

    function stop() { if (unsub) unsub(); unsub = null; }
    function setState(s) { state = s; draw(); cb.change(); }
    function forget() { try { sessionStorage.removeItem(roomKey); } catch (e) {} }
    function remember() { try { sessionStorage.setItem(roomKey, code); } catch (e) {} }
    function fail(message) { err = message; stop(); forget(); setState('error'); }

    // Count the game once per player, even if the page is reloaded mid-game
    function countGame() {
      const key = 'gambit-counted-' + code;
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) {}
      A.db().collection('users').doc(A.user().uid)
        .update({ games: window.firebase.firestore.FieldValue.increment(1), lastSeen: A.ts() }).catch(() => {});
    }

    function watch() {
      stop();
      unsub = ref.onSnapshot(snap => {
        if (!snap.exists) { fail(t('onNoGame', { c: code })); return; }
        const g = snap.data(), me = A.user() && A.user().uid;
        const amHost = g.host === me;
        if (!g.guest) { if (amHost && state !== 'waiting') setState('waiting'); return; }
        myColor = amHost ? g.hostColor : g.hostColor === 'w' ? 'b' : 'w';
        opp = amHost
          ? { nick: g.guestNick, elo: g.guestElo, country: g.guestCountry, admin: !!g.guestAdmin }
          : { nick: g.hostNick, elo: g.hostElo, country: g.hostCountry, admin: !!g.hostAdmin };
        if (state !== 'connected') { setState('connected'); cb.start(myColor); countGame(); }
        cb.applyState({ round: g.round || 0, moves: Array.isArray(g.moves) ? g.moves : [], resigned: g.resigned || null });
      }, e => fail(A.errText(e)));
    }

    async function host(side) {
      if (!A.canPlay()) { A.prompt(() => host(side)); return; }
      setState('opening');
      await A.refresh();
      const db = A.db(), me = A.user().uid, nick = A.profile().nick;
      for (let i = 0; i < 4; i++) {
        code = makeCode();
        ref = db.collection('games').doc(code);
        try {
          await ref.set({
            game, host: me, hostNick: nick, hostColor: side === 'b' ? 'b' : 'w', guest: null, guestNick: null,
            hostElo: A.elo(game), hostCountry: A.country(), hostAdmin: A.isAdmin(),
            round: 0, moves: [], resigned: null, createdAt: A.ts(), updatedAt: A.ts()
          });
          copied = false; remember(); watch();
          return;
        } catch (e) {
          // A taken code looks like "permission denied": try another one
          if (e.code !== 'permission-denied' || i === 3) { fail(A.errText(e)); return; }
        }
      }
    }

    async function join(raw) {
      const c1 = clean(raw);
      if (!c1) return;
      if (!A.canPlay()) { A.prompt(() => join(c1)); return; }
      code = c1; setState('connecting');
      await A.refresh();
      ref = A.db().collection('games').doc(code);
      try {
        const snap = await ref.get();
        if (!snap.exists) { fail(t('onNoGame', { c: code })); return; }
        const g = snap.data(), me = A.user().uid;
        if (g.game !== game) { fail(t('onWrongGame')); return; }
        if (g.host !== me && g.guest && g.guest !== me) { fail(t('onFull')); return; }
        if (g.host !== me && !g.guest) await ref.update({ guest: me, guestNick: A.profile().nick, guestElo: A.elo(game), guestCountry: A.country(), guestAdmin: A.isAdmin(), updatedAt: A.ts() });
        remember(); watch();
      } catch (e) { fail(A.errText(e)); }
    }

    function leave() { stop(); forget(); myColor = null; setState('idle'); }

    function push() {
      if (state !== 'connected' || !ref) return;
      ref.update({ ...cb.getState(), updatedAt: A.ts() }).catch(e => { err = A.errText(e); draw(); });
    }

    function draw() {
      const link = location.origin + location.pathname + '?game=' + game + '&join=' + code;
      const joinForm = `<div class="muted">${t('onOr')}</div>
        <form class="row" data-act="join"><input id="${game}-code" maxlength="5" autocomplete="off" placeholder="${t('onCodePh')}" aria-label="${t('onCodePh')}"><button class="b">${t('onJoin')}</button></form>`;
      let h = '';
      if (!A.user() || !A.profile()) {
        h = `<div class="muted">${t('onNeedLogin')}</div><div class="row"><button class="b primary" data-act="login">${t('acLogin')}</button></div>`;
      } else if (A.banned()) {
        h = `<div class="warn">${t('onBanned')}</div>`;
      } else if (state === 'idle' || state === 'error') {
        if (state === 'error') h += `<div class="warn">${esc(t('onError', { e: err }))}</div>`;
        h += `<div class="row"><button class="b primary" data-act="host">${t('onCreate')}</button></div>` + joinForm;
      } else if (state === 'opening' || state === 'connecting') {
        h += `<div class="muted">${state === 'opening' ? t('onOpening') : esc(t('onConnecting', { c: code }))}</div>
          <div class="row"><button class="b" data-act="leave">${t('cancel')}</button></div>`;
      } else if (state === 'waiting') {
        h += `<div class="muted">${t('onCode')}</div><div class="code">${esc(code)}</div>
          <div class="link">${esc(link)}</div>
          <div class="row"><button class="b primary" data-act="copy" data-link="${esc(link)}">${copied ? t('onCopied') : t('onCopy')}</button>
          <button class="b" data-act="leave">${t('cancel')}</button></div>
          <div class="muted">${t('onWaiting')}</div>`;
      } else if (state === 'connected') {
        h += `<div class="ok">${t('onVs')} ${opp ? A.badge(opp) : '?'}</div>
          <div class="muted">${t('onConnected', { c: t(myColor === 'w' ? 'white' : 'black').toLowerCase() })}</div>
          ${err ? `<div class="warn">${esc(err)}</div>` : ''}
          <div class="row"><button class="b" data-act="leave">${t('onLeave')}</button></div>`;
      }
      box.innerHTML = h;
    }

    box.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b || b.tagName === 'FORM') return;
      const act = b.dataset.act;
      if (act === 'host') host(cb.side());
      else if (act === 'leave') leave();
      else if (act === 'login') A.prompt();
      else if (act === 'copy') {
        const done = () => { copied = true; draw(); };
        try { navigator.clipboard.writeText(b.dataset.link).then(done, () => {}); } catch (e2) {}
      }
    });
    box.addEventListener('submit', e => {
      e.preventDefault();
      join(box.querySelector('input').value);
    });
    document.addEventListener('gambit-lang', draw);
    if (A) A.onChange(() => { if (A.banned() && state !== 'idle') leave(); else draw(); });
    draw();

    const session = {
      join, leave, draw, push,
      color: () => (state === 'connected' ? myColor : null),
      oppElo: () => (opp && typeof opp.elo === 'number' ? opp.elo : 1000),
      active: () => state === 'connected',
      waiting: () => state === 'waiting',
      saved: () => { try { return sessionStorage.getItem(roomKey) || ''; } catch (e) { return ''; } }
    };
    hooks[game] = { session, enter: cb.enter };
    return session;
  }

  // After sign-in is known: open a shared link (?game=chess&join=CODE), or return to the game
  // this tab was playing before a reload
  function autoJoin(linkGame, linkCode) {
    if (!available) return;
    A.onReady(() => {
      if (linkCode && hooks[linkGame]) {
        hooks[linkGame].enter(true);
        hooks[linkGame].session.join(linkCode);
        return;
      }
      for (const g of Object.keys(hooks)) {
        const saved = hooks[g].session.saved();
        if (saved && A.canPlay()) { hooks[g].enter(false); hooks[g].session.join(saved); }
      }
    });
  }

  return { available, create, autoJoin };
})();
</script>

const KN = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];

function newGame() {
  const b = new Array(64).fill(null);
  const back = 'RNBQKBNR';
  for (let c = 0; c < 8; c++) {
    b[c] = 'b' + back[c]; b[8 + c] = 'bP';
    b[48 + c] = 'wP'; b[56 + c] = 'w' + back[c];

  return { b, turn: 'w', cr: { wK: true, wQ: true, bK: true, bQ: true }, ep: -1, hm: 0, stack: [] };
}

function attacked(b, sq, by) {
  const r = sq >> 3, c = sq & 7;
  const pr = by === 'w' ? r + 1 : r - 1;
  if (pr >= 0 && pr < 8) {
    if (c > 0 && b[pr * 8 + c - 1] === by + 'P') return true;
    if (c < 7 && b[pr * 8 + c + 1] === by + 'P') return true;
  }
  for (const [dr, dc] of KN) {
    const r1 = r + dr, c1 = c + dc;
    if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8 && b[r1 * 8 + c1] === by + 'N') return true;
  }
  for (const [dr, dc] of AL) {
    const r1 = r + dr, c1 = c + dc;
    if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8 && b[r1 * 8 + c1] === by + 'K') return true;
  }
  for (const [dr, dc] of DG) {
    let r1 = r + dr, c1 = c + dc;
    while (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {
      const p = b[r1 * 8 + c1];
      if (p) { if (p[0] === by && (p[1] === 'B' || p[1] === 'Q')) return true; break; }
      r1 += dr; c1 += dc;
    }
  }
  for (const [dr, dc] of OR) {
    let r1 = r + dr, c1 = c + dc;
    while (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {
      const p = b[r1 * 8 + c1];
      if (p) { if (p[0] === by && (p[1] === 'R' || p[1] === 'Q')) return true; break; }
      r1 += dr; c1 += dc;
    }

function kingSq(b, col) { return b.indexOf(col + 'K'); }
function inCheck(s, col) { return attacked(s.b, kingSq(s.b, col), opp(col)); }

function pseudo(s, capturesOnly) {
  const ms = [], b = s.b, col = s.turn, en = opp(col);
  const add = (from, to, p, cap, promoRank) => {
    if (promoRank) for (const t of 'QRBN') ms.push({ from, to, p, cap, promo: t });
    else ms.push({ from, to, p, cap });
  };
  for (let sq = 0; sq < 64; sq++) {
    const p = b[sq];
    if (!p || p[0] !== col) continue;
    const t = p[1], r = sq >> 3, c = sq & 7;
    if (t === 'P') {
      const d = col === 'w' ? -1 : 1, r1 = r + d, last = col === 'w' ? 0 : 7;
      if (r1 < 0 || r1 > 7) continue;
      const f = r1 * 8 + c;
      if (!b[f] && (!capturesOnly || r1 === last)) {
        add(sq, f, p, undefined, r1 === last);
        if (!capturesOnly && r === (col === 'w' ? 6 : 1) && !b[f + d * 8]) ms.push({ from: sq, to: f + d * 8, p, flag: 'double' });
      }
      for (const dc of [-1, 1]) {

        const t2 = r1 * 8 + c1, q = b[t2];
        if (q && q[0] === en) add(sq, t2, p, q, r1 === last);
        else if (t2 === s.ep) ms.push({ from: sq, to: t2, p, cap: en + 'P', flag: 'ep' });
      }
    } else if (t === 'N' || t === 'K') {
      for (const [dr, dc] of t === 'N' ? KN : AL) {
        const r1 = r + dr, c1 = c + dc;
        if (r1 < 0 || r1 > 7 || c1 < 0 || c1 > 7) continue;
        const t2 = r1 * 8 + c1, q = b[t2];
        if (q ? q[0] === en : !capturesOnly) ms.push({ from: sq, to: t2, p, cap: q || undefined });
      }
      if (t === 'K' && !capturesOnly) {
        const home = col === 'w' ? 60 : 4;
        if (sq === home && !attacked(b, home, en)) {
          if (s.cr[col + 'K'] && !b[home + 1] && !b[home + 2] && b[home + 3] === col + 'R' &&
              !attacked(b, home + 1, en) && !attacked(b, home + 2, en))
            ms.push({ from: sq, to: home + 2, p, flag: 'castle' });
          if (s.cr[col + 'Q'] && !b[home - 1] && !b[home - 2] && !b[home - 3] && b[home - 4] === col + 'R' &&
              !attacked(b, home - 1, en) && !attacked(b, home - 2, en))

      }
    } else {
      const dirs = t === 'B' ? DG : t === 'R' ? OR : AL;
      for (const [dr, dc] of dirs) {
        let r1 = r + dr, c1 = c + dc;
        while (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {
          const t2 = r1 * 8 + c1, q = b[t2];

function make(s, m) {
  const b = s.b, col = m.p[0];

  b[m.from] = null;
  b[m.to] = m.promo ? col + m.promo : m.p;
  if (m.flag === 'ep') b[m.to + (col === 'w' ? 8 : -8)] = null;
  if (m.flag === 'castle') { const [rf, rt] = CASTLE_ROOK[m.to]; b[rt] = b[rf]; b[rf] = null; }
  s.ep = m.flag === 'double' ? (m.from + m.to) / 2 : -1;
  if (m.p[1] === 'K') { s.cr[col + 'K'] = false; s.cr[col + 'Q'] = false; }
  for (const x of [m.from, m.to]) {
    if (x === 63) s.cr.wK = false; else if (x === 56) s.cr.wQ = false;
    else if (x === 7) s.cr.bK = false; else if (x === 0) s.cr.bQ = false;
  }
  s.hm = (m.p[1] === 'P' || m.cap) ? 0 : s.hm + 1;
  s.turn = opp(col);
}

function unmake(s) {
  const u = s.stack.pop(), m = u.m, b = s.b, col = m.p[0];
  b[m.from] = m.p;
  if (m.flag === 'ep') { b[m.to] = null; b[m.to + (col === 'w' ? 8 : -8)] = m.cap; }
  else b[m.to] = m.cap || null;
  if (m.flag === 'castle') { const [rf, rt] = CASTLE_ROOK[m.to]; b[rf] = b[rt]; b[rt] = null; }
  s.cr = u.cr; s.ep = u.ep; s.hm = u.hm; s.turn = col;
}

function legal(s) {
  const col = s.turn;
  return pseudo(s).filter(m => { make(s, m); const ok = !inCheck(s, col); unmake(s); return ok; });
}

function san(s, m, all) {
  let out;
  if (m.flag === 'castle') out = (m.to & 7) === 6 ? '0-0' : '0-0-0';
  else if (m.p[1] === 'P') {
    out = (m.cap ? FILES[m.from & 7] + ':' : '') + sqName(m.to) + (m.promo ? RU[m.promo] : '');
  } else {
    out = RU[m.p[1]];
    const others = all.filter(o => o.p === m.p && o.to === m.to && o.from !== m.from);
    if (others.length) {
      const sameFile = others.some(o => (o.from & 7) === (m.from & 7));
      const sameRank = others.some(o => (o.from >> 3) === (m.from >> 3));
      out += !sameFile ? FILES[m.from & 7] : !sameRank ? String(8 - (m.from >> 3)) : sqName(m.from);
    }
    out += (m.cap ? ':' : '') + sqName(m.to);
  }
  make(s, m);
  if (inCheck(s, s.turn)) out += legal(s).length ? '+' : '#';

// ---------- AI ----------
function evaluate(s) {
  const b = s.b;
  let score = 0, nonPawn = 0;
  for (let i = 0; i < 64; i++) { const p = b[i]; if (p && p[1] !== 'P' && p[1] !== 'K') nonPawn += VAL[p[1]]; }
  const endgame = nonPawn <= 1600;
  for (let i = 0; i < 64; i++) {
    const p = b[i]; if (!p) continue;
    const t = p[1], idx = p[0] === 'w' ? i : (7 - (i >> 3)) * 8 + (i & 7);
    const v = VAL[t] + (t === 'K' && endgame ? PST.KE : PST[t])[idx];
    score += p[0] === 'w' ? v : -v;
  }
  return s.turn === 'w' ? score : -score;
}

function order(ms) {
  for (const m of ms) m.o = (m.cap ? 10 * VAL[m.cap[1]] - VAL[m.p[1]] + 1000 : 0) + (m.promo === 'Q' ? 900 : 0);
  ms.sort((a, b) => b.o - a.o);
}

let nodes = 0;
function quiesce(s, alpha, beta, qd) {
  nodes++;
  const stand = evaluate(s);
  if (stand >= beta) return beta;
  if (stand > alpha) alpha = stand;
  if (qd >= 4) return alpha;
  const ms = pseudo(s, true); order(ms);
  const col = s.turn;
  for (const m of ms) {
    make(s, m);
    if (inCheck(s, col)) { unmake(s); continue; }
    const v = -quiesce(s, -beta, -alpha, qd + 1);
    unmake(s);
    if (v >= beta) return beta;
    if (v > alpha) alpha = v;
  }
  return alpha;
}

function negamax(s, depth, alpha, beta, ply) {
  nodes++;
  if (s.hm >= 100) return 0;
  if (depth === 0) return quiesce(s, alpha, beta, 0);
  const ms = pseudo(s); order(ms);
  const col = s.turn;
  let any = false;
  for (const m of ms) {
    make(s, m);
    if (inCheck(s, col)) { unmake(s); continue; }
    any = true;
    const v = -negamax(s, depth - 1, -beta, -alpha, ply + 1);
    unmake(s);
    if (v >= beta) return beta;
    if (v > alpha) alpha = v;
  }
  if (!any) return inCheck(s, col) ? -100000 + ply : 0;
  return alpha;
}

// Easy: a random move, grabbing a piece about half the time
function dumbMove(s) {
  const ms = legal(s), caps = ms.filter(m => m.cap);
  const pool = caps.length && Math.random() < 0.5 ? caps : ms;
  return pool[Math.floor(Math.random() * pool.length)];
}

// Medium and hard: a real search; `noise` (in centipawns) blurs its judgement
function searchMove(s, depth, noise) {
  const ms = legal(s);
  order(ms);
  let best = ms[0], bestV = -Infinity;
  for (const m of ms) {
    make(s, m);
    const v = -negamax(s, depth - 1, -Infinity, Infinity, 1) + (Math.random() - 0.5) * 2 * noise;
    unmake(s);
    if (v > bestV) { bestV = v; best = m; }
  }
  return best;
}

function botMove(s, level) {
  if (level === 'easy') return dumbMove(s);
  if (level === 'medium') return Math.random() < 0.15 ? dumbMove(s) : searchMove(s, 2, 60);
  const endgame = s.b.filter(Boolean).length <= 10;
  return searchMove(s, endgame ? 4 : 3, 8);
}

// ---------- Post-game report ----------
const CLS = {
  brill: { s: '!!' }, best: { s: '★' }, good: { s: '' }, inacc: { s: '?!' }, mist: { s: '?' }, blun: { s: '??' }
};
const clampV = v => Math.max(-2000, Math.min(2000, v));
const sameMove = (a, b) => a.from === b.from && a.to === b.to && (a.promo || null) === (b.promo || null);

// After the move is made: a piece was left en prise for less than it is worth
function isSacrifice(s, m) {
  const t = m.p[1];
  if (t === 'P' || t === 'K') return false;
  const col = m.p[0], give = VAL[t] - (m.cap ? VAL[m.cap[1]] : 0);
  if (give < 200 || !attacked(s.b, m.to, opp(col))) return false;
  return !attacked(s.b, m.to, col) || VAL[t] >= 500;
}

function classify(loss, sac, bestV) {
  if (sac && loss <= 20 && bestV < 600) return 'brill';
  if (loss <= 10) return 'best';
  if (loss <= 60) return 'good';
  if (loss <= 150) return 'inacc';
  if (loss <= 300) return 'mist';
  return 'blun';
}

let report = null, anToken = 0;
function analyze() {
  const token = ++anToken, list = history.map(h => h.m), s = newGame();
  report = { plies: [], done: false };
  let i = 0;
  const step = () => {
    if (token !== anToken) return;
    if (i >= list.length) { report.done = true; render(); return; }
    const col = s.turn, ms = legal(s);
    let best = ms[0], bestV = -Infinity, playedV = null, pm = ms[0];
    for (const m of ms) {
      make(s, m);
      const v = clampV(-negamax(s, 2, -Infinity, Infinity, 1));
      unmake(s);
      if (v > bestV) { bestV = v; best = m; }
      if (sameMove(m, list[i])) { playedV = v; pm = m; }
    }
    const loss = sameMove(best, pm) ? 0 : Math.max(0, bestV - playedV);
    const bestSan = san(s, best, ms);
    make(s, pm);
    report.plies.push({ col, loss, bestSan, best: { from: best.from, to: best.to }, isBest: sameMove(best, pm), cls: classify(loss, isSacrifice(s, pm), bestV) });
    i++;
    render();
    setTimeout(step, 0);
  };
  render();
  setTimeout(step, 30);
}

function renderReport() {
  const el = $('report');
  if (!report) { el.hidden = true; return; }
  el.hidden = false;
  const n = history.length, k = report.plies.length;
  $('repProg').textContent = report.done ? '' : t('analysis', { k, n });
  const cnt = { w: {}, b: {} }, sum = { w: 0, b: 0 }, num = { w: 0, b: 0 };
  for (const p of report.plies) {
    cnt[p.col][p.cls] = (cnt[p.col][p.cls] || 0) + 1;
    sum[p.col] += Math.min(p.loss, 1000); num[p.col]++;
  }
  const acc = c => (num[c] ? Math.round(100 * Math.exp(-sum[c] / num[c] / 200)) + '%' : '—');
  let h = report.done ? '' : `<div class="bar"><i style="width:${n ? (100 * k / n) : 0}%"></i></div>`;
  h += `<table class="rep"><thead><tr><th></th><th>${t('colW')}</th><th>${t('colB')}</th></tr></thead><tbody>`;
  h += `<tr class="acc"><td>${t('acc')}</td><td>${acc('w')}</td><td>${acc('b')}</td></tr>`;
  for (const [key, c] of Object.entries(CLS)) {
    h += `<tr><td><span class="bdg ${key}">${c.s || '✓'}</span>${t('cls')[key][0]}</td><td>${cnt.w[key] || 0}</td><td>${cnt.b[key] || 0}</td></tr>`;
  }
  h += '</tbody></table>';
  const moments = report.plies.map((p, i) => ({ ...p, i })).filter(p => p.cls === 'brill' || p.cls === 'blun' || p.cls === 'mist');
  if (moments.length) {
    h += `<div class="key"><h3>${t('key')} <small>${t('keyHint')}</small></h3>`;
    for (const p of moments) {
      const num = Math.floor(p.i / 2) + 1 + (p.i % 2 ? '…' : '.');
      const hint = p.cls === 'brill' ? t('sacOk') : `${t('better')} ${fmt(p.bestSan)} (−${(p.loss / 100).toFixed(1)})`;
      h += `<button class="km${view === p.i ? ' on' : ''}" data-ply="${p.i}"><span class="bdg ${p.cls}">${CLS[p.cls].s}</span><span><b>${num} ${fmt(history[p.i].san)}</b> ${t('cls')[p.cls][1]}, <span class="hint">${hint}</span></span></button>`;
    }
    h += '</div>';
  } else if (report.done) {
    h += `<div class="key"><h3>${t('key')}</h3><span class="hint">${t('clean')}</span></div>`;
  }
  $('repBody').innerHTML = h;
}

// ---------- Game state ----------
let G, history, keys, sel = null, targets = [], pendingPromo = null, flipped = false, thinking = false, dropSq = -1, resigned = null;

const aiColor = () => (modeSel.value === 'ai' ? opp(sideSel.value) : null);
const online = () => modeSel.value === 'online';
let round = 0; // bumped by "New game" so both players know to start over

let rs = {}; // this game's rating state: mode, side and bot level it started with

}

}
const ratedOppElo = () => (rs.mode === 'online' ? net.oppElo() : BOT_ELO[rs.level] || 1000);

boardEl.addEventListener('click', e => {

<script>
// ---------- Russian draughts ----------
(() => {
'use strict';
const $ = id => document.getElementById(id);
const t = (k, v) => window.gambitI18n.t(k, v);
const FILES = 'abcdefgh', sqName = i => FILES[i & 7] + (8 - (i >> 3));
const DIRS = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
const isKing = p => p === 'W' || p === 'B';
const colorOf = p => (p ? (p === 'w' || p === 'W' ? 'w' : 'b') : null);
const opp = c => (c === 'w' ? 'b' : 'w');
const onB = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
const lastRow = col => (col === 'w' ? 0 : 7);

function initBoard() {
  const b = new Array(64).fill(null);
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    if ((r + c) % 2 !== 1) continue;
    if (r < 3) b[r * 8 + c] = 'b'; else if (r > 4) b[r * 8 + c] = 'w';
  }
  return b;
}

// All complete capture sequences from `sq`. Captured pieces stay on the board until the move ends
// (they block and cannot be jumped twice); a man reaching the last row continues as a king.
function jumps(b, sq, p, col, path, capt, crowned) {
  const king = isKing(p) || crowned, r = sq >> 3, c = sq & 7, out = [];
  for (const [dr, dc] of DIRS) {
    if (!king) {
      const r2 = r + 2 * dr, c2 = c + 2 * dc;
      if (!onB(r2, c2)) continue;
      const mid = (r + dr) * 8 + c + dc, land = r2 * 8 + c2;
      if (colorOf(b[mid]) !== opp(col) || capt.includes(mid) || b[land]) continue;
      out.push(...jumps(b, land, p, col, [...path, land], [...capt, mid], crowned || r2 === lastRow(col)));
    } else {
      let r1 = r + dr, c1 = c + dc;
      while (onB(r1, c1) && !b[r1 * 8 + c1]) { r1 += dr; c1 += dc; }
      if (!onB(r1, c1)) continue;
      const mid = r1 * 8 + c1;
      if (colorOf(b[mid]) !== opp(col) || capt.includes(mid)) continue;
      const subs = [];
      let r2 = r1 + dr, c2 = c1 + dc;
      while (onB(r2, c2) && !b[r2 * 8 + c2]) {

        subs.push(jumps(b, land, p, col, [...path, land], [...capt, mid], true));
        r2 += dr; c2 += dc;

}

function genMoves(b, col) {
  let caps = [];
  for (let i = 0; i < 64; i++) {
    const p = b[i];
    if (colorOf(p) !== col) continue;
    const b2 = b.slice(); b2[i] = null;
    caps = caps.concat(jumps(b2, i, p, col, [i], [], false));
  }
  if (caps.length) return caps;
  const ms = [];
  for (let i = 0; i < 64; i++) {
    const p = b[i];
    if (colorOf(p) !== col) continue;
    const r = i >> 3, c = i & 7;
    for (const [dr, dc] of DIRS) {
      if (!isKing(p)) {
        if (dr !== (col === 'w' ? -1 : 1)) continue;
        const r1 = r + dr, c1 = c + dc, to = r1 * 8 + c1;
        if (onB(r1, c1) && !b[to]) ms.push({ from: i, to, path: [i, to], caps: [], promo: r1 === lastRow(col) });
      } else {
        let r1 = r + dr, c1 = c + dc;
        while (onB(r1, c1) && !b[r1 * 8 + c1]) {
          const to = r1 * 8 + c1;
          ms.push({ from: i, to, path: [i, to], caps: [], promo: false });
          r1 += dr; c1 += dc;

}

function apply(b, m) {
  const nb = b.slice(), p = nb[m.from];
  nb[m.from] = null;
  for (const x of m.caps) nb[x] = null;
  nb[m.to] = m.promo ? p.toUpperCase() : p;
  return nb;
}

const notation = m => m.path.map(sqName).join(m.caps.length ? ':' : '-');

// ---------- Bot ----------
function evaluate(b, col) {
  let s = 0;
  for (let i = 0; i < 64; i++) {
    const p = b[i];
    if (!p) continue;
    const r = i >> 3, c = i & 7;
    let v = isKing(p) ? 300 : 100 + (p === 'w' ? 7 - r : r) * 4;
    if (c >= 2 && c <= 5 && r >= 2 && r <= 5) v += 6;
    s += colorOf(p) === 'w' ? v : -v;
  }
  return col === 'w' ? s : -s;
}

function negamax(b, col, depth, alpha, beta, ply) {
  const ms = genMoves(b, col);
  if (!ms.length) return -10000 + ply;
  // Keep searching through capture chains so the bot sees the recapture
  if (depth <= 0 && (!ms[0].caps.length || depth < -6)) return evaluate(b, col);
  ms.sort((x, y) => y.caps.length - x.caps.length);
  for (const m of ms) {
    const v = -negamax(apply(b, m), opp(col), depth - 1, -beta, -alpha, ply + 1);
    if (v >= beta) return beta;
    if (v > alpha) alpha = v;
  }
  return alpha;
}

function searchMove(b, col, depth, noise) {
  const ms = genMoves(b, col);
  let best = ms[0], bestV = -Infinity;
  for (const m of ms) {
    const v = -negamax(apply(b, m), opp(col), depth - 1, -Infinity, Infinity, 1) + (Math.random() - 0.5) * 2 * noise;
    if (v > bestV) { bestV = v; best = m; }
  }
  return best;
}

function botMove(b, col, level) {
  const ms = genMoves(b, col);
  if (!ms.length) return null;
  if (level === 'easy') return ms[Math.floor(Math.random() * ms.length)];
  if (level === 'medium') return Math.random() < 0.15 ? ms[Math.floor(Math.random() * ms.length)] : searchMove(b, col, 3, 40);
  return searchMove(b, col, 7, 4);
}

// ---------- Game ----------
const modeSel = $('ckMode'), sideSel = $('ckSide'), levelSel = $('ckLevel'), boardEl = $('ckBoard');
let S, hist, sel = null, targets = [], flipped = false, thinking = false;
const aiColor = () => (modeSel.value === 'ai' ? opp(sideSel.value) : null);
const online = () => modeSel.value === 'online';
let round = 0; // bumped by "New game" so both players know to start over

// ---------- Rating ----------
const BOT_ELO = { easy: 400, medium: 1000, hard: 1600 };
const A = () => window.gambitAuth;
let rs = {}, ratingNote = '';
function newRating() { rs = { mode: modeSel.value, side: sideSel.value, level: levelSel.value, unrated: '', done: false }; }
function myRatedColor() { return rs.mode === 'online' ? net.color() : rs.mode === 'ai' ? rs.side : null; }
const ratedOppElo = () => (rs.mode === 'online' ? net.oppElo() : BOT_ELO[rs.level] || 1000);
function noteFor(r, key) {
  if (!r) return '';
  if (r.error) return t(r.error === 'fast' ? 'rtFast' : 'rtFail');
  const d = r.delta > 0 ? `<span class="up">+${r.delta}</span>` : r.delta < 0 ? `<span class="down">${r.delta}</span>` : '±0';
  return t(key, { a: r.old, b: r.next, d });
}
function setNote(html) { ratingNote = html; $('ckRatingNote').innerHTML = html; }
function finishRated() {
  const me = myRatedColor();
  if (rs.done || !me || !A() || !A().available) return;
  rs.done = true;
  if (!A().canPlay()) { if (rs.mode === 'ai') setNote(t('rtGuest')); return; }
  if (rs.unrated) { setNote(t(rs.unrated)); return; }
  const key = result().key;
  const score = key === 'ckDraw' ? 0.5 : (key === 'ckWinW') === (me === 'w') ? 1 : 0;
  setNote(t('rtSaving'));
  A().rate('checkers', ratedOppElo(), score).then(r => setNote(noteFor(r, 'rtResult')));
}
function abandonRated() {
  const me = myRatedColor();
  if (rs.done || rs.unrated || !me || !A() || !A().canPlay() || result().over) return;
  if (hist.filter(h => h.turn === me).length < 2) return;
  rs.done = true;
  A().rate('checkers', ratedOppElo(), 0).then(r => setNote(noteFor(r, 'rtAbandon')));
}

const net = window.gambitNet.create('checkers', $('ckOnlineBox'), {
  side: () => sideSel.value,
  start: () => { round = 0; reset(); },
  getState: () => ({ round, moves: hist.map(h => h.m.path.join('-')) }),
  applyState: st => {
    if (typeof st.round !== 'number' || !Array.isArray(st.moves) || st.round < round) return;
    if (st.round > round) { round = st.round; reset(); }
    const same = (a, m) => a === m.path.join('-');
    if (st.moves.length < hist.length || !hist.every((h, i) => same(st.moves[i], h.m))) return;
    for (let i = hist.length; i < st.moves.length; i++) {
      const m = genMoves(S.b, S.turn).find(x => same(st.moves[i], x));
      if (!m) break;
      play(m, true);
    }
  },
  change: () => render(),
  enter: show => { if (show) setGame('checkers'); modeSel.value = 'online'; reset(); }
});

function result() {
  const ms = genMoves(S.b, S.turn);
  if (!ms.length) return { key: S.turn === 'w' ? 'ckWinB' : 'ckWinW', over: true };
  if (S.kc >= 30) return { key: 'ckDraw', over: true };
  return { over: false, moves: ms };
}

function reset() {
  S = { b: initBoard(), turn: 'w', kc: 0 };
  hist = []; sel = null; targets = []; thinking = false;
  newRating(); setNote('');
  flipped = online() ? net.color() === 'b' : modeSel.value === 'ai' && sideSel.value === 'b';
  render(); maybeAI();
}

function play(m, remote) {
  const kingMove = isKing(S.b[m.from]);
  hist.push({ b: S.b, turn: S.turn, kc: S.kc, m, san: notation(m) });
  S.b = apply(S.b, m);
  S.kc = m.caps.length || !kingMove ? 0 : S.kc + 1;
  S.turn = opp(S.turn);
  if (online() && !remote) net.push();
  sel = null; targets = [];
  if (result().over) finishRated();
  render(); maybeAI();
}

function maybeAI() {
  if (S.turn !== aiColor() || result().over) return;
  thinking = true; render();
  setTimeout(() => {
    const m = botMove(S.b, S.turn, levelSel.value);
    thinking = false;
    if (m) play(m); else render();
  }, 450);
}

function undo() {
  if (thinking || !hist.length || online()) return;
  if (!rs.done) rs.unrated = 'rtUndo';
  setNote(t('rtUndo'));
  do { const h = hist.pop(); S.b = h.b; S.turn = h.turn; S.kc = h.kc; } while (hist.length && S.turn === aiColor());
  sel = null; targets = [];
  render(); maybeAI();
}

function onSquare(i) {
  if (thinking) return;
  const res = result();
  if (res.over || S.turn === aiColor() || (online() && S.turn !== net.color())) return;
  const hit = targets.find(m => m.to === i);
  if (sel !== null && hit) { play(hit); return; }
  const mine = res.moves.filter(m => m.from === i);
  if (mine.length && sel !== i) { sel = i; targets = mine; } else { sel = null; targets = []; }
  render();
}

function disc(p) {
  const crown = isKing(p) ? '<path class="crown" d="M12.5 23.5l-1-9.5 4.8 4.3L20 12l3.7 6.3 4.8-4.3-1 9.5z"/>' : '';
  return `<svg class="ck ${colorOf(p)}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="22" r="15"/><circle cx="20" cy="19" r="15"/><circle class="ln" cx="20" cy="19" r="10"/>${crown}</svg>`;
}

function render() {
  const res = result();
  const last = hist.length ? hist[hist.length - 1].m : null;
  const forced = !res.over && res.moves[0].caps.length > 0;
  const mustFrom = forced && sel === null && S.turn !== aiColor() ? new Set(res.moves.map(m => m.from)) : new Set();
  let html = '';
  for (let k = 0; k < 64; k++) {
    const i = flipped ? 63 - k : k, r = i >> 3, c = i & 7, p = S.b[i];
    const cls = ['sq'];
    if ((r + c) % 2) cls.push('d');
    if (last && last.path.includes(i)) cls.push('last');
    if (i === sel) cls.push('sel');
    if (mustFrom.has(i)) cls.push('must');
    if (targets.some(m => m.to === i)) cls.push('tgt');
    let co = '';
    if (k % 8 === 0) co += `<span class="co r">${8 - r}</span>`;
    if (k >= 56) co += `<span class="co f">${FILES[c]}</span>`;
    html += `<button class="${cls.join(' ')}" data-i="${i}" aria-label="${sqName(i)}${p ? ' ' + p : ''}">${co}${p ? disc(p) : ''}</button>`;
  }
  boardEl.innerHTML = html;

  const st = $('ckStatus');
  st.className = 'status' + (res.over ? ' over' : forced ? ' chk' : '');
  if (res.over) st.innerHTML = t(res.key);
  else {
    let txt = thinking ? t('thinking') : t(S.turn === 'w' ? 'turnW' : 'turnB') + (forced ? '. ' + t('ckMust') : '');
    if (online()) txt = !net.active() ? t(net.waiting() ? 'onWait' : 'onIdle') : t(S.turn === 'w' ? 'turnW' : 'turnB') + t(S.turn === net.color() ? 'onYour' : 'onTheirs') + (forced && S.turn === net.color() ? '. ' + t('ckMust') : '');
    st.innerHTML = `<span class="dot ${S.turn}"></span><span>${txt}</span>`;
  }
  const count = col => S.b.filter(p => colorOf(p) === col).length;
  $('ckLeft').textContent = t('ckLeft', { w: count('w'), b: count('b') });

  const mv = $('ckMoves');
  if (!hist.length) mv.innerHTML = `<span class="empty">${t('empty')}</span>`;
  else {
    let s = '';
    for (let i = 0; i < hist.length; i += 2) {
      s += `<span class="n">${i / 2 + 1}.</span><span class="${i === hist.length - 1 ? 'cur' : ''}">${hist[i].san}</span>`;
      s += hist[i + 1] ? `<span class="${i + 1 === hist.length - 1 ? 'cur' : ''}">${hist[i + 1].san}</span>` : '<span></span>';
    }
    mv.innerHTML = s;
    mv.scrollTop = mv.scrollHeight;
  }
  $('ckUndo').disabled = thinking || !hist.length || online();
  $('ckAiOpts').hidden = !(modeSel.value === 'ai' || online());
  levelSel.closest('label').hidden = online();
  sideSel.disabled = online() && net.active();
  $('ckOnlineBox').hidden = !online();
  $('ckBotElo').textContent = t('rtBot', { e: BOT_ELO[levelSel.value] });
  $('ckRatingNote').innerHTML = ratingNote;
}

boardEl.addEventListener('click', e => {
  const sq = e.target.closest('[data-i]');
  if (sq) onSquare(+sq.dataset.i);
});
$('ckNew').addEventListener('click', () => {
  if (thinking) return;
  abandonRated();
  reset();
  if (online()) { round++; net.push(); }
});
$('ckUndo').addEventListener('click', undo);
$('ckFlip').addEventListener('click', () => { flipped = !flipped; render(); });
if (!window.gambitNet.available) modeSel.querySelector('[value=online]').remove();
modeSel.addEventListener('change', () => { abandonRated(); if (!online()) net.leave(); if (!thinking) reset(); });
sideSel.addEventListener('change', () => { abandonRated(); if (!thinking) reset(); });
levelSel.addEventListener('change', () => {
  if (!hist.length) rs.level = levelSel.value;
  else if (!rs.done && !result().over) { rs.unrated = 'rtLevel'; setNote(t('rtLevel')); }
  render();
});
document.addEventListener('gambit-lang', render);

// ---------- Game switch ----------
const tagEl = document.querySelector('header .tag');
let currentGame = 'chess';
function setGame(g) {
  g = g || currentGame; currentGame = g;
  $('adminApp').hidden = true;
  $('chessApp').hidden = g !== 'chess';
  $('checkersApp').hidden = g !== 'checkers';
  for (const b of document.querySelectorAll('[data-game]')) b.setAttribute('aria-pressed', String(b.dataset.game === g));
  tagEl.dataset.t = g === 'chess' ? 'tag' : 'ckTag';
  window.gambitI18n.apply();
  document.dispatchEvent(new Event('gambit-game'));
  try { localStorage.setItem('gambit-game', g); } catch (e) {}
}
for (const b of document.querySelectorAll('[data-game]')) b.addEventListener('click', () => setGame(b.dataset.game));

reset();
let saved = 'chess';
try { if (localStorage.getItem('gambit-game') === 'checkers') saved = 'checkers'; } catch (e) {}
setGame(saved);
window.gambitSetGame = setGame;
window.gambitCurrentGame = () => currentGame;
window.gambitAuth.init();
const q = new URLSearchParams(location.search);
window.gambitNet.autoJoin(q.get('game') === 'checkers' ? 'checkers' : 'chess', q.get('join'));
})();
</script>
</body>
</html>
